name: Clean the runner
description: >
  On a self-hosted runner, remove what the job built so the next one starts with
  the disk free. A GitHub-hosted runner is thrown away after the job, so there
  this does nothing. Put it last, with `if: always()`.
runs:
  using: composite
  steps:
    - shell: bash
      continue-on-error: true
      run: |
        [ "${RUNNER_ENVIRONMENT:-}" = self-hosted ] || exit 0
        cd "$GITHUB_WORKSPACE" || exit 0
        free_kb() { df -k --output=avail "$GITHUB_WORKSPACE" | tail -1 | tr -d ' '; }
        before=$(free_kb)
        # The build trees at the top of the checkout. Not the directories the
        # workflows cache or keep between runs (cutlass-bin-cache, ollama-models,
        # suites, hip-tests ...): their save steps run after this one.
        for d in build build-*; do
          [ -d "$d" ] || continue
          rm -rf "$d" 2>/dev/null || sudo -n rm -rf "$d" 2>/dev/null || echo "could not remove $d"
        done
        # Leftovers of a build outside the checkout.
        rm -rf "$RUNNER_TEMP"/* 2>/dev/null || true
        # Docker on the host, where the job could reach it: stopped containers, dangling
        # images and build cache older than a day. Not the toolchain images (no -a).
        if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
          docker container prune -f --filter until=24h >/dev/null 2>&1 || true
          docker image prune -f --filter until=24h >/dev/null 2>&1 || true
          docker builder prune -f --filter until=24h >/dev/null 2>&1 || true
        fi
        after=$(free_kb)
        echo "Runner disk: $((before / 1024)) MB free before the clean-up, $((after / 1024)) MB after."
        echo "Runner disk: $((before / 1024)) MB free before the clean-up, $((after / 1024)) MB after." >> "$GITHUB_STEP_SUMMARY"
