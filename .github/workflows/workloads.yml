name: Workloads

# Every pantheon workload, on a spread of simulated machines.
#
# The pull-request CI runs three workloads on one A10 so a change gets an answer
# in minutes. This is the check that the other forty-odd still run, on every card,
# GPU counts and CUDA versions people actually use. It runs when a change merges
# and again every day: the workloads live in their own repository and change
# without this one changing, and a break from that side should not wait for the
# next simulator commit to be noticed.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      workloads:
        description: Workloads to run, space separated, or all
        default: all
      pantheon-ref:
        description: Branch, tag or commit of pantheongpu/pantheon
        default: main
  # A change to this workflow or the runner is tested the way it will run.
  pull_request:
    paths:
      - .github/workflows/workloads.yml
      - tests/workloads/**
  # For the pantheon repository to trigger a run when it changes.
  repository_dispatch:
    types: [pantheon-updated]

permissions:
  contents: read

# A merge supersedes the run for the merge before it; a scheduled run is never
# cancelled by one.
concurrency:
  group: workloads-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

# Steps run with bash, in the toolchain containers too, where a step's shell
# would otherwise be sh: the steps use [[ ]], pipefail, arrays and PIPESTATUS.
defaults:
  run:
    shell: bash

jobs:
  # The toolchain images (.github/ci-image), found by ci-image-ref.yml.
  image:
    uses: ./.github/workflows/ci-image-ref.yml

  machine:
    name: ${{ matrix.count }} x ${{ matrix.gpu }}, CUDA ${{ matrix.cuda }}
    needs: image
    runs-on: ubuntu-24.04
    # The CUDA version's toolchain image, or (empty) the runner itself with
    # the install step below.
    container:
      image: ${{ matrix.cuda == '12.0' && needs.image.outputs.cuda12_0 || needs.image.outputs.cuda13_0 }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --shm-size=2g
    # A full suite takes 20 to 40 minutes on a 4-core runner. Every workload
    # also has its own timeout below, so a hang costs one row, not the job.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Every NVIDIA profile the simulator carries (the coverage job below
        # fails when one is added without a row here). The Makefile builds for
        # the architecture nvidia-smi reports, and profiles that share an
        # architecture still differ in memory, device identity and what
        # nvidia-smi and NVML report. CUDA 12.0 and 13.0 alternate across each
        # architecture, and counts above one take all_reduce and p2p_thrasher
        # down their real multi-GPU paths. A profile no toolchain here can build
        # for is listed in a "# not-run nvidia/<name>: reason" line instead;
        # the coverage job accepts exactly those and the summary expects one
        # machine fewer for each.
        include:
          - { key: t4-x1-cuda12.0,    gpu: nvidia/t4,          count: 1, cuda: '12.0' }  # Turing 7.5
          - { key: a100-x1-cuda12.0,  gpu: nvidia/a100,        count: 1, cuda: '12.0' }  # Ampere 8.0
          - { key: a10-x2-cuda12.0,   gpu: nvidia/a10,         count: 2, cuda: '12.0' }  # Ampere 8.6
          - { key: l4-x1-cuda13.0,    gpu: nvidia/l4,          count: 1, cuda: '13.0' }  # Ada 8.9
          - { key: h100-x8-cuda13.0,  gpu: nvidia/h100,        count: 8, cuda: '13.0' }  # Hopper 9.0, a full node
          - { key: gh200-x1-cuda13.0, gpu: nvidia/gh200-480gb, count: 1, cuda: '13.0' }  # Grace Hopper
          - { key: b200-x2-cuda13.0,  gpu: nvidia/b200,        count: 2, cuda: '13.0' }  # Blackwell 10.0, CUDA 12.8+
          - { key: l40s-x1-cuda12.0,  gpu: nvidia/l40s,        count: 1, cuda: '12.0' }  # Ada 8.9
          - { key: rtx3060-x1-cuda12.0, gpu: nvidia/rtx3060,   count: 1, cuda: '12.0' }  # Ampere 8.6, consumer
          - { key: rtx3080ti-x1-cuda13.0, gpu: nvidia/rtx3080ti, count: 1, cuda: '13.0' }  # Ampere 8.6, the measured card
          - { key: a10g-x1-cuda13.0,  gpu: nvidia/a10g,        count: 1, cuda: '13.0' }  # Ampere 8.6
          - { key: a100-40gb-x2-cuda13.0, gpu: nvidia/a100-sxm4-40gb, count: 2, cuda: '13.0' }  # Ampere 8.0
          - { key: h100-pcie-x1-cuda12.0, gpu: nvidia/h100-pcie, count: 1, cuda: '12.0' }  # Hopper 9.0 on CUDA 12
          - { key: h200-x4-cuda13.0,  gpu: nvidia/h200,        count: 4, cuda: '13.0' }  # Hopper 9.0
          - { key: rtx5090-x1-cuda13.0, gpu: nvidia/rtx5090,   count: 1, cuda: '13.0' }  # Blackwell 12.0, consumer; CUDA 12.8+
          - { key: b300-x1-cuda13.0,  gpu: nvidia/b300,        count: 1, cuda: '13.0' }  # Blackwell Ultra 10.3; CUDA 12.9+
          - { key: a100-80gb-pcie-x1-cuda13.0, gpu: nvidia/a100-80gb-pcie, count: 1, cuda: '13.0' }  # Ampere 8.0, PCIe
          - { key: a30-x1-cuda12.0, gpu: nvidia/a30, count: 1, cuda: '12.0' }  # Ampere 8.0
          - { key: a40-x1-cuda13.0, gpu: nvidia/a40, count: 1, cuda: '13.0' }  # Ampere 8.6
          - { key: rtx-a5000-x1-cuda12.0, gpu: nvidia/rtx-a5000, count: 1, cuda: '12.0' }  # Ampere 8.6, workstation
          - { key: rtx-a6000-x1-cuda13.0, gpu: nvidia/rtx-a6000, count: 1, cuda: '13.0' }  # Ampere 8.6, workstation
          - { key: rtx3070-x1-cuda12.0, gpu: nvidia/rtx3070, count: 1, cuda: '12.0' }  # Ampere 8.6, consumer
          - { key: rtx3090-x1-cuda13.0, gpu: nvidia/rtx3090, count: 1, cuda: '13.0' }  # Ampere 8.6, consumer
          - { key: rtx2080ti-x1-cuda13.0, gpu: nvidia/rtx2080ti, count: 1, cuda: '13.0' }  # Turing 7.5, consumer
          - { key: l40-x1-cuda13.0, gpu: nvidia/l40, count: 1, cuda: '13.0' }  # Ada 8.9
          - { key: rtx4080-x1-cuda12.0, gpu: nvidia/rtx4080, count: 1, cuda: '12.0' }  # Ada 8.9, consumer
          - { key: rtx4090-x1-cuda13.0, gpu: nvidia/rtx4090, count: 1, cuda: '13.0' }  # Ada 8.9, consumer
          - { key: rtx6000-ada-x1-cuda12.0, gpu: nvidia/rtx6000-ada, count: 1, cuda: '12.0' }  # Ada 8.9, workstation
          - { key: h100-nvl-x2-cuda12.0, gpu: nvidia/h100-nvl, count: 2, cuda: '12.0' }  # Hopper 9.0, two NVLink-bridged cards
          - { key: h200-nvl-x1-cuda13.0, gpu: nvidia/h200-nvl, count: 1, cuda: '13.0' }  # Hopper 9.0
          - { key: gb10-x1-cuda13.0, gpu: nvidia/gb10, count: 1, cuda: '13.0' }  # Blackwell 12.1, unified memory; CUDA 12.9+
          - { key: gb200-x2-cuda13.0, gpu: nvidia/gb200, count: 2, cuda: '13.0' }  # Blackwell 10.0, Grace Blackwell
          - { key: thor-x1-cuda13.0, gpu: nvidia/thor, count: 1, cuda: '13.0' }  # Blackwell 11.0, Jetson Thor; CUDA 13.0+
          - { key: rtx-pro-6000-x1-cuda13.0, gpu: nvidia/rtx-pro-6000, count: 1, cuda: '13.0' }  # Blackwell 12.0, workstation
          - { key: rtx-pro-6000-max-q-x1-cuda13.0, gpu: nvidia/rtx-pro-6000-max-q, count: 1, cuda: '13.0' }  # Blackwell 12.0, Max-Q
          - { key: rtx-pro-6000-server-x1-cuda13.0, gpu: nvidia/rtx-pro-6000-server, count: 1, cuda: '13.0' }  # Blackwell 12.0, server
          - { key: rtx-pro-4500-x1-cuda13.0, gpu: nvidia/rtx-pro-4500, count: 1, cuda: '13.0' }  # Blackwell 12.0, server, read from a card
          # not-run nvidia/vr200: Rubin is compute capability 10.7, which needs CUDA 13.4 (the
          # profile cites its release notes); the CUDA 13.0 toolchain image cannot compile
          # for sm_107, so every workload fails to build. Give it a row, on a 13.4 image,
          # and delete this line when the toolchain image moves to 13.4 or later.
    env:
      # CUDA 13 packages from NVIDIA's repository: the compiler and the headers
      # of every library the simulator stands in for.
      CUDA13_PACKAGES: >-
        cuda-nvcc-13-0 cuda-cudart-dev-13-0 cuda-crt-13-0 cuda-nvml-dev-13-0 cuda-cupti-dev-13-0
        cuda-nvrtc-dev-13-0 libcublas-dev-13-0 libcufft-dev-13-0 libcurand-dev-13-0
        libcusparse-dev-13-0 libnvjpeg-dev-13-0 libcusolver-dev-13-0 libnpp-dev-13-0
    permissions: { contents: read, packages: read, actions: write, pull-requests: read }  # pr-guard cancels a run whose PR conflicts
    steps:
      - uses: actions/checkout@v4
        with:
          path: pantheonsim
      - uses: ./pantheonsim/.github/actions/pr-guard

      - uses: actions/checkout@v4
        with:
          repository: pantheongpu/pantheon
          ref: ${{ inputs.pantheon-ref || 'main' }}
          path: pantheon

      - name: Install CUDA ${{ matrix.cuda }}
        if: ${{ !job.container.id }}
        env:
          CUDA: ${{ matrix.cuda }}
        run: |
          sudo apt-get update -qq
          if [[ "$CUDA" == 12.0 ]]; then
            # Ubuntu's own toolkit. Its nvcc rejects GCC 13's headers, so it
            # compiles with GCC 12.
            sudo apt-get install -y -qq --no-install-recommends build-essential cmake ninja-build g++-12 nvidia-cuda-toolkit
            echo "NVCC_PREPEND_FLAGS=-ccbin g++-12" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y -qq --no-install-recommends build-essential cmake ninja-build wget ca-certificates
            wget -qO /tmp/keyring.deb https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
            sudo dpkg -i /tmp/keyring.deb
            sudo apt-get update -qq
            read -ra packages <<<"$CUDA13_PACKAGES"
            sudo apt-get install -y -qq --no-install-recommends "${packages[@]}"
            echo "/usr/local/cuda-$CUDA/bin" >> "$GITHUB_PATH"
            echo "CUDA_HOME=/usr/local/cuda-$CUDA" >> "$GITHUB_ENV"
          fi

      - name: Build VirtualGPU
        working-directory: pantheonsim
        run: |
          nvcc --version | tail -2
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(ci/jobs.sh -p release)"
          ls build/shim/libcudart.so.*

      - name: Run every workload
        working-directory: pantheonsim
        env:
          VGPU_WORKLOADS: ${{ inputs.workloads || 'all' }}
          VGPU_WORKLOAD_GPU: ${{ matrix.gpu }}
          VGPU_WORKLOAD_COUNT: ${{ matrix.count }}
          # CPU-sized: the same code over a smaller working set. A GPU retires
          # about 10^13 operations a second and this interpreter about 10^8.
          VGPU_WORKLOAD_SECONDS: '5'
          VGPU_WORKLOAD_ARGS: --kernel_loops 2 --warmup_iters 1 --grid_size 4
          VGPU_WORKLOAD_TIMEOUT: '300'
          # mma_virus and omni_virus run a cuBLASLt GEMM, which the simulator computes
          # on the host; the default 4096 cubed does not finish in the timeout.
          VGPU_WORKLOAD_GEMM_SIZE: '256'
          KEY: ${{ matrix.key }}
        # Paths from $GITHUB_WORKSPACE: the github.workspace and runner.temp
        # expressions name the runner's paths even inside a container.
        run: |
          export VGPU_PANTHEON_DIR="$GITHUB_WORKSPACE/pantheon" VGPU_BUILD_DIR="$GITHUB_WORKSPACE/pantheonsim/build"
          export VGPU_WORKLOAD_REPORT="$GITHUB_WORKSPACE/report/$KEY"
          ./tests/workloads/run_pantheon_workloads.sh

      - name: Results
        if: always()
        run: cat "$GITHUB_WORKSPACE/report/${{ matrix.key }}/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no results were written" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workloads-${{ matrix.key }}
          path: report/${{ matrix.key }}
          retention-days: 14
          if-no-files-found: ignore

  # A profile added to the simulator without a row in the matrix would go
  # untested without anyone noticing; this says so on the pull request.
  coverage:
    name: every profile is in the matrix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows
            nvidia/profiles
      - name: Compare the matrix with nvidia/profiles
        run: |
          have=$(grep -oE 'gpu: nvidia/[a-z0-9-]+' .github/workflows/workloads.yml | sed 's#gpu: nvidia/##' | sort -u)
          skip=$(grep -oE '^ *# not-run nvidia/[a-z0-9-]+:' .github/workflows/workloads.yml | sed -E 's#^ *\# not-run nvidia/##; s#:$##' | sort -u)
          want=$(find nvidia/profiles -name '*.yaml' -printf '%f\n' | sed 's/[.]yaml$//' | sort -u)
          # A profile is either in the matrix or explicitly not run, never both,
          # and a not-run line must name a real profile.
          both=$(comm -12 <(printf '%s\n' "$have") <(printf '%s\n' "$skip") | tr '\n' ' ')
          missing=$(comm -13 <(printf '%s\n' "$have" "$skip" | sort -u) <(printf '%s\n' "$want") | tr '\n' ' ')
          stale=$(comm -23 <(printf '%s\n' "$have" "$skip" | sort -u) <(printf '%s\n' "$want") | tr '\n' ' ')
          echo "matrix: $(printf '%s\n' "$have" | wc -l) profiles; not run: $(printf '%s\n' "$skip" | grep -c .); nvidia/profiles: $(printf '%s\n' "$want" | wc -l)"
          [ -z "${missing// }" ] || { echo "::error::not in the workloads matrix: $missing"; exit 1; }
          [ -z "${stale// }" ] || { echo "::error::in the matrix but not a profile: $stale"; exit 1; }
          [ -z "${both// }" ] || { echo "::error::both in the matrix and marked not-run: $both"; exit 1; }

  summary:
    name: every machine
    needs: machine
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows
            ci
            tests/workloads
            nvidia/profiles

      - uses: actions/download-artifact@v4
        with:
          pattern: workloads-*
          path: results

      - name: One table
        run: |
          # One machine per NVIDIA profile (the coverage job holds the matrix to
          # that), so a machine that wrote nothing is reported as missing.
          profiles=$(find nvidia/profiles -name '*.yaml' | wc -l)
          notrun=$(grep -cE '^ *# not-run nvidia/[a-z0-9-]+:' .github/workflows/workloads.yml || true)
          python3 tests/workloads/workload_matrix.py results "$((profiles - notrun))" > matrix.md
          cat matrix.md >> "$GITHUB_STEP_SUMMARY"

      # While main is broken there is one open issue saying where, updated by
      # each run and closed by the first run that passes. A red scheduled run
      # nobody opens is the failure this is here to prevent. A run a later push
      # cancelled says nothing about main, so the script leaves the issue alone.
      - name: Track failures in an issue
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.machine.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ci/track-workloads-issue.sh
