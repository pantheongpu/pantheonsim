name: Action

# The GitHub Action in action.yml, used the way a project would use it: install,
# then compile and run a CUDA program on the simulated GPUs it provides.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  use-the-action:
    name: compile and run CUDA on simulated GPUs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: PantheonSim
        id: sim
        uses: ./
        with:
          gpu: nvidia/t4
          count: 2

      - name: The job sees two T4s
        run: |
          nvidia-smi -L
          test "$(nvidia-smi --query-gpu=name --format=csv,noheader | grep -c 'Tesla T4')" = 2

      - name: Compile a kernel with plain nvcc and run it
        run: |
          cat > vectoradd.cu <<'CU'
          #include <cstdio>
          __global__ void add(float* c, const float* a, const float* b, int n) {
            int i = blockIdx.x * blockDim.x + threadIdx.x;
            if (i < n) c[i] = a[i] + b[i];
          }
          int main() {
            const int n = 4096;
            float a[n], b[n], c[n];
            for (int i = 0; i < n; ++i) { a[i] = i; b[i] = 2 * i; }
            float* da, *db, *dc;
            cudaMalloc(&da, sizeof a); cudaMalloc(&db, sizeof b); cudaMalloc(&dc, sizeof c);
            cudaMemcpy(da, a, sizeof a, cudaMemcpyHostToDevice);
            cudaMemcpy(db, b, sizeof b, cudaMemcpyHostToDevice);
            add<<<(n + 255) / 256, 256>>>(dc, da, db, n);
            if (cudaDeviceSynchronize() != cudaSuccess) return 2;
            cudaMemcpy(c, dc, sizeof c, cudaMemcpyDeviceToHost);
            for (int i = 0; i < n; ++i) if (c[i] != 3 * i) { std::printf("wrong at %d\n", i); return 1; }
            std::printf("ok: %d elements\n", n);
            return 0;
          }
          CU
          nvcc -arch=compute_75 -code=compute_75 vectoradd.cu -o vectoradd
          vgpu run ./vectoradd

      - name: The same binary on every GPU profile
        run: |
          vgpu test --matrix ./vectoradd | tee matrix.txt
          grep -q ' 0 different' matrix.txt

      - name: The outputs name the build
        run: test -x "${{ steps.sim.outputs.build-dir }}/vgpu" && test -e "${{ steps.sim.outputs.shim-dir }}/libcudart.so"

  amd:
    name: compile and run HIP on simulated AMD GPUs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: PantheonSim
        uses: ./
        with:
          gpu: amd/mi300x
          count: 2

      - name: The job sees two MI300Xs, and nvcc was not installed
        run: |
          rocm-smi
          test "$(rocm_agent_enumerator | grep -c gfx942)" = 2
          ! command -v /usr/bin/nvcc

      - name: Compile with ROCm's hipcc and run it, under vgpu run and directly
        run: |
          cat > vectoradd.hip <<'HIP'
          #include <hip/hip_runtime.h>
          #include <cstdio>
          __global__ void add(float* c, const float* a, const float* b, int n) {
            int i = blockIdx.x * blockDim.x + threadIdx.x;
            if (i < n) c[i] = a[i] + b[i];
          }
          int main() {
            const int n = 4096;
            float a[n], b[n], c[n];
            for (int i = 0; i < n; ++i) { a[i] = i; b[i] = 2 * i; }
            int devices = 0;
            if (hipGetDeviceCount(&devices) != hipSuccess || devices != 2) { std::printf("devices: %d\n", devices); return 3; }
            float* da, *db, *dc;
            if (hipMalloc(&da, sizeof a) || hipMalloc(&db, sizeof b) || hipMalloc(&dc, sizeof c)) return 2;
            hipMemcpy(da, a, sizeof a, hipMemcpyHostToDevice);
            hipMemcpy(db, b, sizeof b, hipMemcpyHostToDevice);
            add<<<(n + 255) / 256, 256>>>(dc, da, db, n);
            if (hipDeviceSynchronize() != hipSuccess) return 2;
            hipMemcpy(c, dc, sizeof c, hipMemcpyDeviceToHost);
            for (int i = 0; i < n; ++i) if (c[i] != 3 * i) { std::printf("wrong at %d\n", i); return 1; }
            std::printf("ok: %d elements\n", n);
            return 0;
          }
          HIP
          hipcc --version | grep -i 'HIP version'
          hipcc --offload-arch=gfx942 vectoradd.hip -o vectoradd
          vgpu run ./vectoradd
          ./vectoradd
          # No --offload-arch: hipcc asks rocm_agent_enumerator, as on a real machine.
          hipcc vectoradd.hip -o vectoradd-native
          ./vectoradd-native

  cuda-version:
    name: compile and run CUDA 12.6 from NVIDIA's repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: PantheonSim
        uses: ./
        with:
          gpu: nvidia/h100
          cuda-toolkit: '12.6'

      - name: nvcc is 12.6 and the job sees an H100
        run: |
          nvcc --version | grep -q 'release 12.6'
          nvidia-smi -L | grep -q H100

      - name: Compile for Hopper and run it
        run: |
          cat > hello.cu <<'CU'
          #include <cstdio>
          __global__ void k(int* out) { out[threadIdx.x] = threadIdx.x * 2; }
          int main() {
            int* d; int h[64];
            cudaMalloc(&d, sizeof h);
            k<<<1, 64>>>(d);
            cudaMemcpy(h, d, sizeof h, cudaMemcpyDeviceToHost);
            for (int i = 0; i < 64; ++i) if (h[i] != 2 * i) return 1;
            cudaDeviceProp p; cudaGetDeviceProperties(&p, 0);
            std::printf("ok on %s (sm_%d%d)\n", p.name, p.major, p.minor);
            return 0;
          }
          CU
          nvcc -arch=compute_90 -code=compute_90 hello.cu -o hello
          vgpu run ./hello | tee out.txt
          grep -q 'H100' out.txt

      # Linking the toolkit's own cuSPARSE needs its libnvJitLink, which NVIDIA's
      # packages do not pull in; cuPDLPx's link failed without it. The link runs
      # without the simulator's libraries on the path, as library-path: false
      # has it, and the program then runs on the simulator's cuSPARSE.
      - name: Link the toolkit's cuSPARSE and cuBLAS and run on the simulator's
        run: |
          cat > spmv.cu <<'CU'
          #include <cstdio>
          #include <cublas_v2.h>
          #include <cusparse.h>
          int main() {
            int rows[3] = {0, 1, 2}, cols[2] = {0, 1};
            double vals[2] = {2, 3}, x[2] = {1, 1}, y[2] = {0, 0}, one = 1, zero = 0, norm = 0;
            int *dr, *dc; double *dv, *dx, *dy;
            cudaMalloc(&dr, sizeof rows); cudaMalloc(&dc, sizeof cols); cudaMalloc(&dv, sizeof vals);
            cudaMalloc(&dx, sizeof x); cudaMalloc(&dy, sizeof y);
            cudaMemcpy(dr, rows, sizeof rows, cudaMemcpyHostToDevice);
            cudaMemcpy(dc, cols, sizeof cols, cudaMemcpyHostToDevice);
            cudaMemcpy(dv, vals, sizeof vals, cudaMemcpyHostToDevice);
            cudaMemcpy(dx, x, sizeof x, cudaMemcpyHostToDevice);
            cusparseHandle_t h; cusparseCreate(&h);
            cusparseSpMatDescr_t A; cusparseDnVecDescr_t X, Y;
            cusparseCreateCsr(&A, 2, 2, 2, dr, dc, dv, CUSPARSE_INDEX_32I, CUSPARSE_INDEX_32I,
                              CUSPARSE_INDEX_BASE_ZERO, CUDA_R_64F);
            cusparseCreateDnVec(&X, 2, dx, CUDA_R_64F); cusparseCreateDnVec(&Y, 2, dy, CUDA_R_64F);
            if (cusparseSpMV(h, CUSPARSE_OPERATION_NON_TRANSPOSE, &one, A, X, &zero, Y, CUDA_R_64F,
                             CUSPARSE_SPMV_ALG_DEFAULT, nullptr)) return 1;
            cublasHandle_t b; cublasCreate(&b);
            cublasDnrm2(b, 2, dy, 1, &norm);
            cudaMemcpy(y, dy, sizeof y, cudaMemcpyDeviceToHost);
            std::printf("y = %g %g, |y| = %g\n", y[0], y[1], norm);
            return y[0] == 2 && y[1] == 3 && norm > 3.605 && norm < 3.606 ? 0 : 1;
          }
          CU
          env -u LD_LIBRARY_PATH nvcc -arch=compute_90 -code=compute_90 spmv.cu -o spmv -lcusparse -lcublas
          vgpu run ./spmv

  # The runners and project setups the jobs above do not cover. Each one is a
  # way a real project might use the action.
  ubuntu-22-04:
    name: ubuntu-22.04, ${{ matrix.gpu }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gpu: [nvidia/t4, amd/mi300x]
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          gpu: ${{ matrix.gpu }}
      - name: Build and run on the simulated GPU
        run: |
          if [[ "${{ matrix.gpu }}" == amd/* ]]; then
            hipcc --offload-arch=gfx942 .github/action-tests/cmake-hip/vectoradd.hip -o vectoradd
          else
            nvcc -arch=compute_75 -code=compute_75 .github/action-tests/cmake-cuda/vectoradd.cu -o vectoradd
          fi
          vgpu run ./vectoradd

  container:
    name: in a container job (root, no sudo)
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          gpu: nvidia/t4
      - name: Build and run on the simulated GPU
        run: |
          nvcc -arch=compute_75 -code=compute_75 .github/action-tests/cmake-cuda/vectoradd.cu -o vectoradd
          vgpu run ./vectoradd

  cmake:
    name: a CMake project, ${{ matrix.gpu }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { gpu: nvidia/t4, project: cmake-cuda }
          - { gpu: amd/mi300x, project: cmake-hip }
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          gpu: ${{ matrix.gpu }}
      - name: Configure, build and ctest, unmodified, with no build type and in Release
        run: |
          # No build type is what a project gets when it sets none, and for
          # HIP that means -O0: unoptimized code, with real calls into the
          # device library. Release is what CI builds usually are.
          for type in "" Release; do
            dir="build-test${type:+-$type}"
            cmake -S .github/action-tests/${{ matrix.project }} -B "$dir" -G Ninja ${type:+-DCMAKE_BUILD_TYPE=$type}
            cmake --build "$dir" -v
            ctest --test-dir "$dir" --output-on-failure
          done
