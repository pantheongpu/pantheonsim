name: rocBLAS nightly

# AMD's own rocBLAS test suite (rocblas-test, the quick tests: some 160,000 of
# them in float and double, and the half, bfloat16 and int8 ones), unmodified,
# on simulated MI300X, MI350X and MI250X GPUs. rocBLAS and hipBLASLt are
# AMD's ROCm 7.1 release, unpacked from AMD's apt repository; the HIP and HSA
# runtimes are the simulator's.
#
# AMD ships no rocblas-test, so the first job builds it from AMD's rocm-7.1.0
# source and caches it; the build runs again only when the cache is gone.
# Every test must pass: a failure is a simulator bug.

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/rocblas-nightly.yml", "amd/tests/rocblas/nightly/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CLIENT_KEY: rocblas-test-rocm-7.1.0-v1

jobs:
  client:
    name: Build AMD's rocblas-test (cached)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions: { contents: read, packages: read, actions: write, pull-requests: read }  # pr-guard cancels a run whose PR conflicts
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pr-guard
      - id: cache
        uses: actions/cache@v4
        with:
          path: ~/rocblas-client
          key: ${{ env.CLIENT_KEY }}
      - name: Make room for the compiler
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup /usr/share/swift
          df -h / | tail -1
      - name: Build it
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          [ ! -x scripts/apt-mirror-fallback.sh ] || scripts/apt-mirror-fallback.sh
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake libgtest-dev libgmock-dev libopenblas-dev \
            libnuma1 libdrm2 libdrm-dev libdrm-amdgpu1 libelf1 zlib1g-dev
          amd/tests/rocblas/nightly/fetch-rocm.sh "$HOME/rocm" build
          # Each of the client's translation units wants a few GB: three at a
          # time fit the runner's 16.
          JOBS=3 amd/tests/rocblas/nightly/build-client.sh "$HOME/rocm" "$HOME/rocblas-client"

  shards:
    name: rocblas-test ${{ matrix.gpu }} ${{ matrix.filter }} (${{ matrix.first }}-${{ matrix.last }} of 25)
    needs: client
    runs-on: ubuntu-24.04
    # The suite is cut into 25 shards, not 100 (2026-11-13): each rocblas-test process
    # spends about 57 s starting up (it re-reads rocblas_gtest.data), so 25 shards do the
    # same tests about 1.6x faster; the mixed job spent ~47 min on process starts at 100.
    # Each job below runs five shards, two at a time. The history at 100 shards:
    # A shard of the float and double tests takes 3 to 7 minutes on this runner and
    # two run at a time, so twenty of them fit well inside the limit (fifty did not:
    # every run since 2026-09-30 was cancelled at the limit). The MI250X shards took
    # 85 to 178 minutes until the speed work of 2026-10-22 (#403) and now take 30 to 60;
    # three of eight nights were cancelled at 180 before it. The limit stays generous so
    # that a slow night is slow, not cancelled.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - {gpu: amd/mi300x, filter: fp, first: 0, last: 4}
          - {gpu: amd/mi300x, filter: fp, first: 5, last: 9}
          - {gpu: amd/mi300x, filter: fp, first: 10, last: 14}
          - {gpu: amd/mi300x, filter: fp, first: 15, last: 19}
          - {gpu: amd/mi300x, filter: fp, first: 20, last: 24}
          - {gpu: amd/mi350x, filter: fp, first: 0, last: 4}
          - {gpu: amd/mi350x, filter: fp, first: 5, last: 9}
          - {gpu: amd/mi350x, filter: fp, first: 10, last: 14}
          - {gpu: amd/mi350x, filter: fp, first: 15, last: 19}
          - {gpu: amd/mi350x, filter: fp, first: 20, last: 24}
          - {gpu: amd/mi250x, filter: fp, first: 0, last: 4}
          - {gpu: amd/mi250x, filter: fp, first: 5, last: 9}
          - {gpu: amd/mi250x, filter: fp, first: 10, last: 14}
          - {gpu: amd/mi250x, filter: fp, first: 15, last: 19}
          - {gpu: amd/mi250x, filter: fp, first: 20, last: 24}
          - {gpu: amd/mi300x, filter: mixed, first: 0, last: 24}
    permissions: { contents: read, packages: read, actions: write, pull-requests: read }  # pr-guard cancels a run whose PR conflicts
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pr-guard
      - uses: actions/cache/restore@v4
        with:
          path: ~/rocblas-client
          key: ${{ env.CLIENT_KEY }}
          fail-on-cache-miss: true
      - name: Build the simulator's HIP runtime
        run: |
          [ ! -x scripts/apt-mirror-fallback.sh ] || scripts/apt-mirror-fallback.sh
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential cmake ninja-build \
            libopenblas0-pthread libgfortran5 libnuma1 libdrm2 libdrm-amdgpu1 libelf1
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(ci/jobs.sh -p release)" --target vgpuhip
      - name: Unpack rocBLAS and hipBLASLt
        run: amd/tests/rocblas/nightly/fetch-rocm.sh "$HOME/rocm" run
      - name: Run the shards
        env:
          VGPU_BUILD_DIR: ${{ github.workspace }}/build
          ROCM_RUN: /home/runner/rocm
          CLIENT: /home/runner/rocblas-client
        run: amd/tests/rocblas/nightly/run-shards.sh ${{ matrix.gpu }} ${{ matrix.filter }} ${{ matrix.first }} ${{ matrix.last }} 25 logs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocblas-${{ strategy.job-index }}
          path: logs
          retention-days: 14
