name: PyTorch sweep nightly

# The whole PyTorch sweep (nvidia/tests/pytorch/sweep.py) and the full
# torch.distributed set (nvidia/tests/pytorch/dist.py) on a simulated NVIDIA
# GPU. The time-bounded quick tier of both runs in every ci.yml `ml` job
# (e2e_pytorch_sweep, e2e_pytorch_dist); this adds the checks that take longer
# (torch.compile's templates, flex_attention, FSDP, every dtype of every
# backend) and, because the runner's image has no torchvision, torchaudio or
# transformers, installs them first so those groups run too.
# Run it by hand with `gh workflow run pytorch-sweep-nightly.yml --ref <branch>`;
# `tests` narrows it to a ctest regular expression; `groups` and `only` narrow the
# sweep itself (a comma list of groups such as "compile,nn", and a regular
# expression on a check's name), for chasing one check without the hour of the rest.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      tests:
        description: "ctest regular expression (the full sweep and the full distributed set if empty)"
        required: false
        default: ''
      groups:
        description: "sweep groups to run, comma separated (every group if empty)"
        required: false
        default: ''
      only:
        description: "regular expression on the sweep's check names (every check if empty)"
        required: false
        default: ''
      script:
        description: "debug: a python file in the repo to run under vgpu instead of the sweep"
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    name: PyTorch sweep, full tier, on the pantheonsim.com runner
    # The same runner as ci.yml's ml job (PyTorch for CUDA 13 in its image);
    # where ML_RUNS_ON is unset the job does not run.
    if: vars.ML_RUNS_ON != ''
    runs-on: ${{ fromJSON(vars.ML_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(ci/jobs.sh -p release)"
      - name: Debug script
        if: inputs.script != ''
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          py=""
          for c in "${VGPU_TORCH_CUDA_PYTHON:-}" $(ls -d "$HOME"/.local/share/torch-cu13*/bin/python 2>/dev/null) python3 python; do
            [ -n "$c" ] && "$c" -c 'import torch, sys; sys.exit(0 if (torch.version.cuda or "").startswith("13") else 1)' 2>/dev/null && { py=$c; break; }
          done
          echo "python: $py"; env | grep -i -E 'torch|vgpu' | sed 's/=.*token.*//' || true
          [ -n "$py" ] || { echo "no python with torch for CUDA 13"; exit 1; }
          cd "$(mktemp -d)"
          TORCH_LOGS=output_code TRITON_CACHE_DIR="$PWD/triton" TORCHINDUCTOR_CACHE_DIR="$PWD/inductor" \
            timeout 3000 "$GITHUB_WORKSPACE/build/vgpu" run --gpu nvidia/rtx5090 --count 1 --preload "$py" "$GITHUB_WORKSPACE/$SCRIPT" > out.log 2>&1 || echo "exit $?"
          cat out.log
      - name: The full sweep
        if: inputs.script == ''
        env:
          TESTS: ${{ inputs.tests }}
          VGPU_SWEEP_GROUPS: ${{ inputs.groups }}
          VGPU_SWEEP_ONLY: ${{ inputs.only }}
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure -R "${TESTS:-^e2e_pytorch_(sweep_full|dist_full)$}" 2>&1 | tee sweep.log
          # A skip is the runner's image losing PyTorch: here that is a failure.
          if grep -E '\*\*\*Skipped|Not Run' sweep.log; then echo "::error::a sweep test skipped"; exit 1; fi
