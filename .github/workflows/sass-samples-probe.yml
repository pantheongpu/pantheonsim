name: sass-samples probe (temporary)

# TEMPORARY, for the sass-samples branch only, removed before it merges: the
# branch's e2e programs on both engines, and the five CUDA Samples it fixes,
# on hosted runners rather than the shared pantheonsim.com one.
on:
  push:
    branches: [sass-samples]

concurrency:
  group: sass-samples-probe
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  image:
    uses: ./.github/workflows/ci-image-ref.yml

  probe:
    name: ${{ matrix.flavor }}
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        flavor: [cuda13_0, cuda12_0]
    container:
      image: ${{ needs.image.outputs[matrix.flavor] }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --shm-size=2g
    env:
      NVCC_PREPEND_FLAGS: ${{ matrix.flavor == 'cuda12_0' && '-ccbin g++-12' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build VirtualGPU
        run: |
          nvcc --version | tail -1
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: The branch's programs on both engines
        env:
          VGPU_SASS_PROGRAMS: dynamic_parallelism:75 cdp_device_api:75 rdc_device_api:75 large_params:75 shared_atomics64:75 vector_add:75
        run: VGPU_BUILD_DIR="$PWD/build" nvidia/tests/e2e/run_sass_archs.sh

      - name: CUDA Samples
        if: always() && matrix.flavor == 'cuda13_0'
        env:
          SUITE_ONLY: /(cdpQuadtree|cdpSimpleQuicksort|cdpSimplePrint|cdpBezierTessellation|jacobiCudaGraphs|LargeKernelParameter)$
          SUITE_TIMEOUT: '900'
          VGPU_SASS_LOG: '1'
        run: |
          ci/external/suites.sh fetch cuda-samples suite
          # Each sample on its own (the whole tree's configure wants libraries
          # this image lacks), where suites.sh looks for it.
          for p in 3_CUDA_Features/cdpQuadtree 3_CUDA_Features/cdpSimpleQuicksort 3_CUDA_Features/cdpSimplePrint \
                   3_CUDA_Features/cdpBezierTessellation 3_CUDA_Features/jacobiCudaGraphs 6_Performance/LargeKernelParameter; do
            sed -i -E 's/set\(CMAKE_CUDA_ARCHITECTURES [^)]*\)/set(CMAKE_CUDA_ARCHITECTURES 86)/' suite/Samples/$p/CMakeLists.txt
            cmake -S suite/Samples/$p -B suite/build/Samples/$p -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CUDA_ARCHITECTURES=86 -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared > /dev/null
            cmake --build suite/build/Samples/$p -j"$(nproc)" | tail -2
          done
          rc=0
          ci/external/suites.sh run cuda-samples suite build/shim report || rc=1
          VGPU_SASS=0 ci/external/suites.sh run cuda-samples suite build/shim report-ptx || rc=1
          for f in report/logs/*.log report-ptx/logs/*.log; do echo "=== $f"; head -c 3000 "$f"; echo; done
          exit $rc
