name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ml_tests:
        description: "The ml job's tests, as a ctest regular expression (all of them if empty)"
        required: false
        default: ''
      cutlass_sass:
        description: "Build the CUTLASS tests' SASS as well as their PTX, and require the SASS to run (VGPU_CUTLASS_SASS)"
        type: boolean
        required: false
        default: false
      nvidia_only:
        description: "Skip the jobs an NVIDIA-side change does not need (pantheon workloads, ollama on every GPU and on each AMD GPU, AMD code objects)"
        type: boolean
        required: false
        default: false

# A push to a pull request that lands while an earlier run is still going
# supersedes it; there is no value in finishing a build of code nobody will look
# at again. main is different: its sanitizer jobs take over an hour and merges
# land faster than that, so cancelling meant no run on main ever finished and
# the repository page showed a failed CI. A run on main finishes; a newer push
# waits behind it (and a still newer one replaces the waiting one).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # nvcc 12.0 rejects this image's default GCC 13 headers (it fails inside
  # <bits/floatn.h> on _Float128), so point it at GCC 12. Only the .cu
  # compilations need this; the shims themselves are ordinary C++.
  NVCC_PREPEND_FLAGS: -ccbin g++-12

# Steps run with bash, in the toolchain containers too, where a step's shell
# would otherwise be sh: the steps use [[ ]], pipefail, arrays and PIPESTATUS.
defaults:
  run:
    shell: bash

jobs:
  # The toolchain images this run's jobs can use (ci-image-ref.yml).
  image:
    uses: ./.github/workflows/ci-image-ref.yml

  build-and-test:
    name: build + unit tests
    # GitHub's hosted runner unless the repository variable SIM_RUNS_ON names
    # another, e.g. ["self-hosted", "pantheonsim-ci"] for the runner on the
    # pantheonsim.com host (pantheonsim-web/deploy/gh-runner). Its image has
    # this job's toolchain built in, so the install step runs only on GitHub's.
    runs-on: ${{ fromJSON(vars.SIM_RUNS_ON || '"ubuntu-24.04"') }}
    # Not in the toolchain image (.github/ci-image) like the other jobs: its
    # session tests (vgpu shell) need the user namespaces and mounts that an
    # unprivileged container refuses, so it keeps the runner and apt.
    permissions: { contents: read, packages: read, actions: write, pull-requests: read }  # pr-guard cancels a run whose PR conflicts
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pr-guard

      - name: Install toolchain
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update -qq
          # nvidia-profiler is nvprof, an unmodified profiler run against the
          # simulator by e2e_nvprof; without it that test skips.
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake ninja-build g++-12 nvidia-cuda-toolkit nvidia-profiler
          nvcc --version | tail -2
          cmake --version | head -1

      - name: Configure
        # -Werror: the build has no warnings (issue #284), and this keeps it that way.
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVGPU_WERROR=ON

      - name: Build
        run: cmake --build build -j"$(ci/jobs.sh -p release)"

      - name: Report which CUDA ABI was detected
        # The shim's soname major follows the installed toolkit, and getting it
        # wrong means programs silently load NVIDIA's real library instead of
        # this one. Print it so a broken detection is visible in the log.
        run: ls build/shim/

      - name: Which nvcc builds the CUTLASS tests
        # Part of the cache key below, so a toolchain update starts a new directory
        # instead of leaving the old key to hit forever with binaries nobody can use.
        id: nvcc_version
        run: echo "v=$(nvcc --version | sed -n 's/.*release \([0-9.]*\).*V\([0-9.]*\)/\1-\2/p')-$(g++ -dumpversion)" >> "$GITHUB_OUTPUT"

      - name: CUTLASS test binaries, from the cache
        # e2e_cutlass_hopper and e2e_cutlass_gemm are nvcc compiles (about
        # 2000 s of their 2200 s, an estimate) of programs that do not depend
        # on the simulator; the tests still run every binary against it. Each
        # binary's file name carries a hash of all its inputs (cutlass_nvcc in
        # nvidia/tests/e2e/cutlass_fetch.sh), so a restored directory never
        # supplies a binary built from other inputs: it is only not found.
        # The key below just decides when a new directory is worth saving.
        id: cutlass_bin
        uses: actions/cache/restore@v4
        with:
          path: cutlass-bin-cache
          key: cutlass-bin-${{ runner.os }}-${{ runner.arch }}-${{ steps.nvcc_version.outputs.v }}-${{ hashFiles('nvidia/tests/e2e/cutlass_fetch.sh', 'nvidia/tests/e2e/run_cutlass_hopper.sh', 'nvidia/tests/e2e/run_cutlass_gemm.sh') }}

      - name: Unit and end-to-end tests
        env:
          VGPU_CUTLASS_BIN_CACHE: ${{ github.workspace }}/cutlass-bin-cache
        # The ML tests are the ml job's: on the runner whose image has PyTorch
        # and rocBLAS they would run here too, and take an hour.
        # -j2 (fewer on a machine with under 12 GiB free, ci/jobs.sh): the two
        # CUTLASS tests were 2200 s of this step's 3200 s (run 38424481981,
        # before the binary cache above) and
        # use one core for their nvcc compiles, so the other tests run beside
        # them. The CUTLASS, CuTe and heavy nvcc tests take the nvcc_memory lock
        # (CMakeLists.txt), so only one of them sizes its compiles from the free
        # memory at a time, and the two CUTLASS tests start first (their COST),
        # so the lock chain overlaps the rest. The ml job below runs the other
        # tests at -j2 already.
        run: ctest --test-dir build --output-on-failure -j"$(ci/jobs.sh -g 6 -m 2)" -E '^(pantheon_workloads|amd_pytorch.*|amd_rocblas|amd_hipsparselt.*)$'

      - name: Keep the CUTLASS test binaries
        # Only after every test passed, so the directory holds both tests'
        # binaries, and only when the restore missed (a key cannot be rewritten).
        if: success() && steps.cutlass_bin.outputs.cache-hit != 'true' && hashFiles('cutlass-bin-cache/*') != ''
        uses: actions/cache/save@v4
        with:
          path: cutlass-bin-cache
          key: ${{ steps.cutlass_bin.outputs.cache-primary-key }}

  workloads:
    name: pantheon workloads
    # A dispatch with nvidia_only skips this job; pushes and pull requests always run it.
    if: ${{ !inputs.nvidia_only }}
    # GitHub's hosted runner unless the repository variable SIM_RUNS_ON names
    # another, e.g. ["self-hosted", "pantheonsim-ci"] for the runner on the
    # pantheonsim.com host (pantheonsim-web/deploy/gh-runner). Its image has
    # this job's toolchain built in, so the install step runs only on GitHub's.
    runs-on: ${{ fromJSON(vars.SIM_RUNS_ON || '"ubuntu-24.04"') }}
    # A passing run takes about 35 minutes on a 4-core runner (int_virus is
    # most of it). Nothing else bounds it, so a hang would otherwise hold the
    # job for GitHub's six-hour default.
    timeout-minutes: 60
    # The toolchain image (.github/ci-image), or, when there is none, the
    # runner itself with the install step below.
    needs: image
    container:
      image: ${{ vars.SIM_RUNS_ON == '' && needs.image.outputs.cuda12_0 || '' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      # The IPC tests need more than Docker's 64 MB of /dev/shm.
      options: --shm-size=2g
    permissions: { contents: read, packages: read, actions: write, pull-requests: read }  # pr-guard cancels a run whose PR conflicts
    steps:
      - uses: actions/checkout@v4
        with:
          path: pantheonsim
      - uses: ./pantheonsim/.github/actions/pr-guard

      # The workloads are the real coverage: unmodified GPU diagnostics, built
      # by their own Makefile, running end to end against the simulator.
      - uses: actions/checkout@v4
        with:
          repository: pantheongpu/pantheon
          path: pantheon

      - name: Install toolchain
        if: runner.environment == 'github-hosted' && !job.container.id
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake ninja-build g++-12 nvidia-cuda-toolkit

      - name: Build VirtualGPU
        working-directory: pantheonsim
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(ci/jobs.sh -p release)"

      - name: Run pantheon workloads
        working-directory: pantheonsim
        # $GITHUB_WORKSPACE, not the github.workspace expression, which names
        # the runner's path even when the job runs in a container.
        run: |
          export VGPU_PANTHEON_DIR="$GITHUB_WORKSPACE/pantheon" VGPU_BUILD_DIR="$GITHUB_WORKSPACE/pantheonsim/build"
          ./tests/workloads/run_pantheon_workloads.sh

  sass:
    name: SASS on every architecture
    # The build job's toolkit is Ubuntu's CUDA 12.0, which targets up to
    # sm_90a; Blackwell's SASS (sm_100, sm_120) needs CUDA 12.8 or later. This
    # job builds against CUDA 13 and runs the SASS tests: the decoder against
    # nvdisasm's corpora, which code a binary runs, and programs built for
    # each generation's SASS run on that generation's GPU and checked against
    # their PTX (nvidia/tests/e2e/run_sass_archs.sh). A run started by hand
    # with cutlass_sass also builds the CUTLASS tests' SASS (sm_90a, sm_100a,
    # sm_120a) and requires it to run, which takes a few hours.
    # GitHub's hosted runner unless the repository variable BURST_RUNS_ON names
    # another pool, e.g. ["pantheonsim-burst"]: AWS instances
    # started while the pull request backlog is long and terminated when it is
    # empty. This is one of the three long jobs (SASS, ASan, TSan) that go to
    # the pool, and it runs in the toolchain image there as it does here.
    # The pool's owner can cap what a job takes with the repository variables
    # BURST_CONTAINER_OPTIONS (docker options such as `--cpus=12 --memory=16g`),
    # BURST_MEM_LIMIT_GIB and BURST_JOBS_MAX (for a job outside a container).
    # All are empty, meaning no cap, until set; tests/lint/check_burst_cap.py
    # keeps every job on BURST_RUNS_ON passing them on.
    runs-on: ${{ fromJSON(vars.CONTAINER_RUNS_ON || vars.BURST_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: ${{ inputs.cutlass_sass && 330 || 60 }}
    # The cuda13.0 toolchain image (.github/ci-image), or, when there is none,
    # the runner itself with the install step below.
    needs: image
    container:
      image: ${{ needs.image.outputs.cuda13_0 }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --shm-size=2g ${{ vars.BURST_CONTAINER_OPTIONS }}
    env:
      NVCC_PREPEND_FLAGS: ''
    permissions: { contents: read, packages: read, actions: write, pull-requests: read }  # pr-guard cancels a run whose PR conflicts
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pr-guard

      # This job needs a lot of memory, and on a shared runner another job may
      # hold most of it. Wait up to 30 minutes for the memory (CI_MEM_WAIT_SECS: a peak
      # from another job usually passes), then fail here, alone, if this one cannot fit, rather than
      # take the machine down part-way (the minimums are in ci/jobs.sh).
      - name: Check the memory
        env:
          CI_MEM_WAIT_SECS: '1800'
        run: ci/jobs.sh --check sass

      - name: Install CUDA 13
        if: ${{ !job.container.id }}
        run: |
          sudo flock /tmp/pool-apt.lock apt-get update -qq
          sudo flock /tmp/pool-apt.lock apt-get install -y -qq --no-install-recommends build-essential cmake ninja-build wget ca-certificates
          wget -qO /tmp/keyring.deb https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i /tmp/keyring.deb
          sudo flock /tmp/pool-apt.lock apt-get update -qq
          sudo flock /tmp/pool-apt.lock apt-get install -y -qq --no-install-recommends \
            cuda-nvcc-13-0 cuda-cudart-dev-13-0 cuda-crt-13-0 cuda-nvml-dev-13-0 cuda-cupti-dev-13-0 \
            cuda-nvrtc-dev-13-0 libcublas-dev-13-0 libcufft-dev-13-0 libcurand-dev-13-0 \
            libcusparse-dev-13-0 libnvjpeg-dev-13-0 libcusolver-dev-13-0 libnpp-dev-13-0
          echo "/usr/local/cuda-13.0/bin" >> "$GITHUB_PATH"
          echo "CUDA_HOME=/usr/local/cuda-13.0" >> "$GITHUB_ENV"

      - name: Build VirtualGPU
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(ci/jobs.sh -p sass)"
          ls build/shim/libcudart.so.*

      - name: The SASS tests
        run: |
          set -o pipefail
          ctest --test-dir build --verbose -R '^(test_sass_decode|e2e_sass_path|e2e_sass_archs)$' 2>&1 | tee sass.log
          if grep -E '\*\*\*Skipped|SKIP' sass.log; then
            echo "::error::a SASS test skipped; this job installs what they need"; exit 1
          fi

      - name: CUTLASS on SASS
        if: inputs.cutlass_sass
        env:
          VGPU_CUTLASS_SASS: '1'
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure -R '^e2e_cutlass_(hopper|gemm|sm100|sm120)$' 2>&1 | tee cutlass.log
          if grep -E '\*\*\*Skipped' cutlass.log; then
            echo "::error::a CUTLASS test skipped; this job installs what they need"; exit 1
          fi

      # The jobs run as root in the container, in a workspace that belongs to the runner's
      # user. On a runner that lasts (the burst pool) what they leave there is root's, and the
      # next job's checkout cannot clean it. Hand it back, whatever the outcome.
      - name: Return the workspace to the runner's user
        if: always() && job.container.id
        run: chown -R "$(stat -c %u:%g "$GITHUB_WORKSPACE/..")" "$GITHUB_WORKSPACE" || true

  ollama:
    name: ollama on every GPU
    # A dispatch with nvidia_only skips this job; pushes and pull requests always run it.
    if: ${{ !inputs.nvidia_only }}
    # GitHub's hosted runner unless BURST_RUNS_ON names a pool (see the SASS job).
    runs-on: ${{ fromJSON(vars.BURST_RUNS_ON || '"ubuntu-24.04"') }}
    # Fourteen GPUs take about 18 minutes on 8 cores; a 4-core runner is slower.
    timeout-minutes: 90
    # The toolchain image (.github/ci-image), or, when there is none, the
    # runner itself with the install step below.
    needs: image
    container:
      image: ${{ needs.image.outputs.cuda13_0 }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      # The IPC tests need more than Docker's 64 MB of /dev/shm.
      options: --shm-size=2g ${{ vars.BURST_CONTAINER_OPTIONS }}
    env:
      # Shims built against CUDA 13 make Ollama pick its cuda_v13 backend,
      # whose PTX starts at sm_75 and so covers every profile.
      NVCC_PREPEND_FLAGS: ''
      OLLAMA_VERSION: v0.21.0
      # Pulled before the test (and cached), so a registry 503 is retried
      # rather than failing the job; the cache key names the model.
      VGPU_OLLAMA_MODEL: smollm2:135m
    permissions: { contents: read, packages: read, actions: write, pull-requests: read }  # pr-guard cancels a run whose PR conflicts
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pr-guard

      # This job needs a lot of memory, and on a shared runner another job may
      # hold most of it. Wait up to 30 minutes for the memory (CI_MEM_WAIT_SECS: a peak
      # from another job usually passes), then fail here, alone, if this one cannot fit, rather than
      # take the machine down part-way (the minimums are in ci/jobs.sh).
      - name: Check the memory
        env:
          CI_MEM_WAIT_SECS: '1800'
        run: ci/jobs.sh --check ollama

      - name: Install CUDA 13
        if: ${{ !job.container.id }}
        run: |
          sudo flock /tmp/pool-apt.lock apt-get update -qq
          sudo flock /tmp/pool-apt.lock apt-get install -y -qq --no-install-recommends build-essential cmake ninja-build wget ca-certificates zstd
          wget -qO /tmp/keyring.deb https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i /tmp/keyring.deb
          sudo flock /tmp/pool-apt.lock apt-get update -qq
          # Every library the simulator stands in for: each shim is compiled
          # against that library's own header, so a missing one fails the build
          # (libcurand-dev did).
          sudo flock /tmp/pool-apt.lock apt-get install -y -qq --no-install-recommends \
            cuda-nvcc-13-0 cuda-cudart-dev-13-0 cuda-crt-13-0 cuda-nvml-dev-13-0 cuda-cupti-dev-13-0 \
            cuda-nvrtc-dev-13-0 libcublas-dev-13-0 libcufft-dev-13-0 libcurand-dev-13-0 \
            libcusparse-dev-13-0 libnvjpeg-dev-13-0 libcusolver-dev-13-0 libnpp-dev-13-0
          echo "/usr/local/cuda-13.0/bin" >> "$GITHUB_PATH"
          echo "CUDA_HOME=/usr/local/cuda-13.0" >> "$GITHUB_ENV"

      - name: Install ollama
        run: |
          # A directory of its own: on a runner that lasts, the last job left root-owned files in a fixed one, and tar
          # could neither replace them nor set their times ("Cannot utime", "File exists").
          ollama_dir="$(mktemp -d "$RUNNER_TEMP/ollama.XXXXXX")"
          wget -qO- "https://github.com/ollama/ollama/releases/download/$OLLAMA_VERSION/ollama-linux-amd64.tar.zst" |
            zstd -d | tar -x -C "$ollama_dir"
          echo "$ollama_dir/bin" >> "$GITHUB_PATH"

      - name: Build VirtualGPU
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(ci/jobs.sh -p ollama)"
          ls build/shim/libcudart.so.*

      - name: The model, from the cache
        id: model
        uses: actions/cache/restore@v4
        with:
          path: ollama-models
          key: ollama-model-${{ env.VGPU_OLLAMA_MODEL }}-v1

      - name: The model, from the registry on a cache miss (retried)
        run: |
          echo "OLLAMA_MODELS=$GITHUB_WORKSPACE/ollama-models" >> "$GITHUB_ENV"
          OLLAMA_MODELS="$GITHUB_WORKSPACE/ollama-models" tests/e2e/ollama_fetch_model.sh "$VGPU_OLLAMA_MODEL"

      - name: Keep the model
        if: steps.model.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ollama-models
          key: ollama-model-${{ env.VGPU_OLLAMA_MODEL }}-v1

      - name: A model on every simulated NVIDIA GPU
        env:
          VGPU_OLLAMA_PULL: '1'
        run: ctest --test-dir build --output-on-failure -R '^e2e_ollama$'

      # The job runs as root in the container, in a workspace that belongs to the runner's
      # user. On a runner that lasts (the burst pool) what it leaves there is root's, and a job
      # that is not in a container (the AMD ollama jobs, the image finder) then cannot clean
      # it at checkout. Hand it back, whatever the outcome.
      - name: Return the workspace to the runner's user
        if: always() && job.container.id
        run: chown -R "$(stat -c %u:%g "$GITHUB_WORKSPACE/..")" "$GITHUB_WORKSPACE" || true

  ollama-amd:
    name: ollama on ${{ matrix.gpu }}
    # A dispatch with nvidia_only skips this job; pushes and pull requests always run it.
    if: ${{ !inputs.nvidia_only }}
    # GitHub's hosted runner unless BURST_RUNS_ON names a pool (see the SASS job).
    runs-on: ${{ fromJSON(vars.BURST_RUNS_ON || '"ubuntu-24.04"') }}
    # A simulated GPU takes some 3 to 17 minutes to load a model and generate
    # three tokens, so each GPU has a job of its own.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        gpu: [amd/mi300x, amd/mi325x, amd/mi350x, amd/mi250x, amd/rx6900xt, amd/rx7900xtx, amd/rx9070xt]
    env:
      OLLAMA_VERSION: v0.21.0
      # No container here, so the ceilings go to ci/jobs.sh (empty means none).
      CI_MEM_LIMIT_GIB: ${{ vars.BURST_MEM_LIMIT_GIB }}
      CI_JOBS_MAX: ${{ vars.BURST_JOBS_MAX }}
      # Pulled before the test (and cached), so a registry 503 is retried
      # rather than failing the job; the cache key names the model.
      VGPU_OLLAMA_MODEL: smollm2:135m
    permissions: { contents: read, packages: read, actions: write, pull-requests: read }  # pr-guard cancels a run whose PR conflicts
    steps:
      # The container jobs (ASan, TSan, SASS) run as root in a workspace that belongs to the
      # runner's user, and when one is cancelled mid-build its own hand-back step is skipped,
      # leaving root-owned build directories. The checkout below cannot clean those ("EACCES:
      # unlink build-san/.ninja_deps"), so every ollama job queued behind it failed in seconds.
      # This job runs on the host, so take the workspace back before the checkout touches it.
      - name: Take back a workspace a container job left
        run: |
          ws="$GITHUB_WORKSPACE"
          if [[ -d "$ws" ]] && [[ -n "$(find "$ws" -maxdepth 3 ! -user "$(id -un)" -print -quit 2>/dev/null)" ]]; then
            # sudo when the runner user has it without a password; otherwise docker, which the
            # runner user always has on these hosts, as root in a throwaway container.
            if ! sudo -n chown -R "$(id -u):$(id -g)" "$ws" 2>/dev/null; then
              docker run --rm --entrypoint /bin/sh -v "$(dirname "$ws"):/w" alpine \
                -c "chown -R $(id -u):$(id -g) /w/$(basename "$ws")" \
                || echo "::warning::could not take back $ws; the checkout may fail"
            fi
          fi

      - uses: actions/checkout@v4
      - uses: ./.github/actions/pr-guard

      # This job needs a lot of memory, and on a shared runner another job may
      # hold most of it. Wait up to 30 minutes for the memory (CI_MEM_WAIT_SECS: a peak
      # from another job usually passes), then fail here, alone, if this one cannot fit, rather than
      # take the machine down part-way (the minimums are in ci/jobs.sh).
      - name: Check the memory
        env:
          CI_MEM_WAIT_SECS: '1800'
        run: ci/jobs.sh --check ollama-amd

      - name: Install ollama and its ROCm backend
        run: |
          sudo flock /tmp/pool-apt.lock apt-get update -qq
          sudo flock /tmp/pool-apt.lock apt-get install -y -qq --no-install-recommends build-essential cmake ninja-build wget ca-certificates zstd
          # A directory of its own: on a runner that lasts, the last job left root-owned files in a fixed one, and tar
          # could neither replace them nor set their times ("Cannot utime", "File exists").
          ollama_dir="$(mktemp -d "$RUNNER_TEMP/ollama.XXXXXX")"
          for t in ollama-linux-amd64.tar.zst ollama-linux-amd64-rocm.tar.zst; do
            wget -qO- "https://github.com/ollama/ollama/releases/download/$OLLAMA_VERSION/$t" |
              zstd -d | tar -x -C "$ollama_dir"
          done
          # Its CUDA backends are not needed here.
          rm -rf "$ollama_dir"/lib/ollama/cuda_* "$ollama_dir"/lib/ollama/mlx_*
          echo "$ollama_dir/bin" >> "$GITHUB_PATH"

      - name: Build VirtualGPU's HIP runtime
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(ci/jobs.sh -p ollama-amd)" --target vgpuhip vgpu_cli

      - name: The model, from the cache
        id: model
        uses: actions/cache/restore@v4
        with:
          path: ollama-models
          key: ollama-model-${{ env.VGPU_OLLAMA_MODEL }}-v1

      - name: The model, from the registry on a cache miss (retried)
        run: |
          echo "OLLAMA_MODELS=$GITHUB_WORKSPACE/ollama-models" >> "$GITHUB_ENV"
          OLLAMA_MODELS="$GITHUB_WORKSPACE/ollama-models" tests/e2e/ollama_fetch_model.sh "$VGPU_OLLAMA_MODEL"

      - name: Keep the model
        if: steps.model.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ollama-models
          key: ollama-model-${{ env.VGPU_OLLAMA_MODEL }}-v1

      - name: A model on the simulated GPU
        env:
          VGPU_OLLAMA_PULL: '1'
          VGPU_OLLAMA_PROFILES: ${{ matrix.gpu }}
        run: ctest --test-dir build --output-on-failure -R '^amd_ollama$'

  amd-code-objects:
    name: AMD code objects and CDNA decoding
    # A dispatch with nvidia_only skips this job; pushes and pull requests always run it.
    if: ${{ !inputs.nvidia_only }}
    # GitHub's hosted runner unless the repository variable SIM_RUNS_ON names
    # another, e.g. ["self-hosted", "pantheonsim-ci"] for the runner on the
    # pantheonsim.com host (pantheonsim-web/deploy/gh-runner). Its image has
    # this job's toolchain built in, so the install step runs only on GitHub's.
    runs-on: ${{ fromJSON(vars.SIM_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 35
    # The tests take 12-16 minutes on a hosted runner; 20 was cancelling one run in three.
    # The toolchain image (.github/ci-image), or, when there is none, the
    # runner itself with the install step below.
    needs: image
    container:
      image: ${{ vars.SIM_RUNS_ON == '' && needs.image.outputs.cuda12_0 || '' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      # The IPC tests need more than Docker's 64 MB of /dev/shm.
      options: --shm-size=2g
    permissions: { contents: read, packages: read, actions: write, pull-requests: read }  # pr-guard cancels a run whose PR conflicts
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pr-guard

      # The checkout belongs to the runner's user and the job runs as root in
      # the container: trust this one repository, or git refuses it (tests ask
      # git which files are tracked). actions/checkout's own exception lasts
      # only for its step.
      - name: Trust the checkout
        if: job.container.id
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # clang builds the gfx942 code objects these tests read, and
      # llvm-objdump prints the instructions the decoder is checked against.
      # No ROCm is needed for either. They are installed here rather than left
      # to the image so the checks cannot quietly skip.
      - name: Install toolchain
        if: runner.environment == 'github-hosted' && !job.container.id
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential cmake ninja-build clang llvm

      - name: Check the toolchain
        run: |
          clang --print-targets | grep amdgcn
          llvm-objdump --version | head -2

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          # Every AMD test binary the next step runs, found by name rather than
          # listed, so a test added later is built without anyone remembering to.
          cmake --build build -j"$(ci/jobs.sh -p release)" --target vgpuhip \
            $(ninja -C build -t targets all | grep -oE '^test_amd[a-z0-9_]*' | sort -u)

      - name: Read code objects, decode CDNA, run it, and check it against the assembler
        run: |
          # Without pipefail the tee's status is the step's, and a test that
          # failed or was never built would pass the job.
          set -o pipefail
          ctest --test-dir build --output-on-failure -R "test_amd_codeobject|test_amd_gcn|test_amd_gcn_exec|test_amd_hip_abi|test_amd_hipcc|test_amd_rocprofiler|test_amd_bundle|amd_gcn_disasm|amd_hip|amd_hipcc|amd_rocm_versions" | tee out
          # A skip here would hide a decoder that no longer matches the
          # assembler, or a HIP program that no longer runs, which is the
          # whole point of this job.
          grep -q "amd_gcn_disasm .* Passed" out
          grep -q "amd_hip .* Passed" out
          grep -q "amd_hipcc .* Passed" out

  ml:
    name: PyTorch, ROCm and the rest of the suite on the pantheonsim.com runner
    # Only on the pantheonsim.com host's runner, named by the repository
    # variable ML_RUNS_ON (["self-hosted", "pantheonsim-ci"]): its image has
    # PyTorch's ROCm build and ROCm's rocBLAS, which no hosted runner has, and
    # the memory the PyTorch tests take. Unmodified: PyTorch's own kernels and
    # the ROCm libraries it ships (hipBLASLt, MIOpen, rocFFT, rocRAND,
    # rocSOLVER, Composable Kernel, hipSPARSELt), torch.compile's Triton
    # kernels, a CNN and a transformer trained a few steps, two GPUs in one
    # process and two processes over torch.distributed, on each simulated
    # Instinct GPU.
    # The other jobs stay on GitHub's hosted runners, which there are many of;
    # this one runner takes this job alone. Where the variable is unset the
    # job does not run.
    if: vars.ML_RUNS_ON != ''
    runs-on: ${{ fromJSON(vars.ML_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 240
    permissions: { contents: read, packages: read, actions: write, pull-requests: read }  # pr-guard cancels a run whose PR conflicts
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pr-guard

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(ci/jobs.sh -p release)"

      - name: PyTorch, rocBLAS and hipSPARSELt
        # A test that skips fails the job: here each has what it needs, so a
        # skip means the runner's image lost it, not that there is nothing to
        # test. A run started by hand may name fewer.
        env:
          ML_TESTS: ${{ inputs.ml_tests }}
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure -R "${ML_TESTS:-^(amd_pytorch.*|amd_rocblas|amd_hipsparselt.*)$}" 2>&1 | tee ml.log
          if grep -E '\*\*\*Skipped|Not Run' ml.log; then
            echo "::error::an ML test skipped; the runner's image should have what it needs"; exit 1
          fi

      - name: The rest of the suite, where ROCm is installed
        # GitHub's hosted runners have no ROCm, so every test that runs ROCm's
        # own programs -- rocminfo, ROCm's HIP runtime over the simulator's
        # HSA, hipcc-built programs, ROCm's libraries -- skips in the other
        # jobs, and nothing ran it: two such tests broke on plain Linux
        # unnoticed. This runner has ROCm 7.1, so they run here. The ML tests
        # ran above; the workloads, every ollama test and the CUTLASS compiles run in the
        # hosted jobs, and vLLM (amd_vllm) in its own workflow, vllm-nightly.yml,
        # which installs vLLM's ROCm build first. A run started by hand for
        # chosen tests skips this.
        #
        # A skip fails the job too, unless the test is named in RUNNER_SKIPS_OK
        # with the reason it cannot run on this machine: a skip that nobody
        # chose is a test that silently stopped running. Allowed now:
        #   e2e_sass_jit_full    the full tier 2 (JIT) matrix is an hour of work and runs only in the
        #                        nightly (VGPU_NIGHTLY=1, sass-ptx.yml); e2e_sass_jit is the PR gate.
        #   e2e_nvprof           nvprof ships only up to CUDA 12; this shim is 13.
        #   amd_rocprofiler_abi, amd_rocprofv3, amd_rocprofiler_pcsampling
        #                        the image's ROCm has no rocprofiler-sdk (yet).
        #   amd_rvs              the image's ROCm has no rocm-validation-suite (yet).
        #   e2e_jit_frameworks   numba and triton are not in the image (yet).
        #   e2e_nvshmem_device   NVIDIA's NVSHMEM (headers, libnvshmem_device.a)
        #                        is not in the image (yet); NVSHMEM_HOME or the
        #                        nvidia-nvshmem-cu13 pip package turns it on.
        #   amd_opencl           ROCm's OpenCL runtime (rocm-opencl) is not in the
        #                        image; the rocm-libraries workflow runs it.
        #   e2e_nvshmem_bootstrap
        #                        the image has no Open MPI (mpicxx), which the MPI bootstrap needs.
        #   e2e_cupti_compat12   it builds against the CUDA 12.3 to 12.9 headers, and this
        #                        image has CUDA 13 only; the 12.4 and 12.8 jobs run it.
        #   e2e_fft_lto_callbacks
        #                        the CUDA toolkit's libnvJitLink (which turns LTO-IR into
        #                        machine code) is nowhere on the image: not beside nvcc, not
        #                        in a pip wheel. Installing libnvjitlink-13-0 (or
        #                        nvidia-nvjitlink-cu13) turns it on.
        #   e2e_packed_int_forms the image's nvcc ptxas does not assemble PTX ISA 9.2's
        #                        packed integer forms for sm_120f.
        #   e2e_runtime_132      it needs a runtime shim built with the CUDA 13.2 headers
        #                        (the 13.2-only runtime functions exist only there), and
        #                        this image has CUDA 13.0; no CI job has 13.2, so every job
        #                        skips it by design (it runs where 13.2 is installed).
        #   e2e_rdc_clones       it checks device functions the device link cloned, and only means
        #                        something where the link made two or more copies of pow; this
        #                        image's nvcc makes none for the test's kernels and the test says
        #                        so and skips (the cuobjdump count in run_rdc_clones.sh). It runs
        #                        on a toolchain whose link clones them.
        #   e2e_host_gpu         it runs kernels on a real NVIDIA card (VGPU_HOST_GPU=exact) and skips
        #                        where there is none, as on this runner.
        # The last four above, and these three, are the image's or the branch's to fix; drop
        # them here when they are.
        if: inputs.ml_tests == ''
        env:
          RUNNER_SKIPS_OK: '^(e2e_sass_jit_full|bench_amd_counters|e2e_nvprof|amd_rocprofiler_abi|amd_rocprofv3|e2e_jit_frameworks|e2e_nvshmem_device|e2e_nvshmem_bootstrap|e2e_cupti_compat12|amd_opencl|e2e_fft_lto_callbacks|e2e_packed_int_forms|e2e_runtime_132|e2e_rdc_clones|e2e_host_gpu|amd_rocprofiler_pcsampling|amd_rvs)$'
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure -j"$(ci/jobs.sh -g 4 -m 2)" \
            -E '^(pantheon_workloads|.*ollama.*|e2e_cutlass.*|e2e_.*cute.*|e2e_tma.*|amd_pytorch.*|amd_rocblas|amd_hipsparselt.*|amd_vllm.*|e2e_pytorch_sweep_full|e2e_pytorch_dist_full)$' \
            2>&1 | tee rest.log
          skipped=$(grep -oE 'Test +#[0-9]+: [A-Za-z0-9_]+ \.+\*\*\*(Skipped|Not Run)' rest.log \
                    | sed -E 's/Test +#[0-9]+: ([A-Za-z0-9_]+).*/\1/' || true)
          # amd_rocprof_*: the image has no rocprofv3 either (the reason amd_rocprofv3 is allowed above).
          unexpected=$(grep -vE "$RUNNER_SKIPS_OK|^amd_rocprof_" <<<"$skipped" | grep . || true)
          if [[ -n "$skipped" ]]; then
            # ctest hides a skipped test's output; the reason is its SKIP line.
            echo "Skipped tests and why:"
            ctest --test-dir build -V -R "^($(grep . <<<"$skipped" | paste -sd'|'))$" 2>&1 | grep -E '^[0-9]+: SKIP:' | sed 's/^/  /' || true
          fi
          if [[ -n "$unexpected" ]]; then
            echo "::error::tests skipped on the runner, which should run them: $(tr '\n' ' ' <<<"$unexpected")"
            exit 1
          fi

  sanitizers:
    name: ASan + UBSan
    # GitHub's hosted runner unless the repository variable BURST_RUNS_ON names
    # another pool, e.g. ["pantheonsim-burst"]: AWS instances
    # started while the pull request backlog is long and terminated when it is
    # empty. This is one of the three long jobs (SASS, ASan, TSan) that go to
    # the pool, and it runs in the toolchain image there as it does here.
    runs-on: ${{ fromJSON(vars.CONTAINER_RUNS_ON || vars.BURST_RUNS_ON || '"ubuntu-24.04"') }}
    # The toolchain image (.github/ci-image), or, when there is none, the
    # runner itself with the install step below.
    needs: image
    container:
      image: ${{ needs.image.outputs.cuda12_0 }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      # TSan's setarch -R needs personality() (seccomp), LeakSanitizer
      # ptrace; the IPC tests more than Docker's 64 MB of /dev/shm.
      options: --shm-size=2g --cap-add=SYS_PTRACE --security-opt seccomp=unconfined ${{ vars.BURST_CONTAINER_OPTIONS }}
    permissions: { contents: read, packages: read, actions: write, pull-requests: read }  # pr-guard cancels a run whose PR conflicts
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pr-guard

      # This job needs a lot of memory, and on a shared runner another job may
      # hold most of it. Wait up to 30 minutes for the memory (CI_MEM_WAIT_SECS: a peak
      # from another job usually passes), then fail here, alone, if this one cannot fit, rather than
      # take the machine down part-way (the minimums are in ci/jobs.sh).
      - name: Check the memory
        env:
          CI_MEM_WAIT_SECS: '1800'
        run: ci/jobs.sh --check asan

      # The checkout belongs to the runner's user and the job runs as root in
      # the container: trust this one repository, or git refuses it (tests ask
      # git which files are tracked). actions/checkout's own exception lasts
      # only for its step.
      - name: Trust the checkout
        if: job.container.id
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install toolchain
        if: ${{ !job.container.id }}
        run: |
          sudo flock /tmp/pool-apt.lock apt-get update -qq
          sudo flock /tmp/pool-apt.lock apt-get install -y -qq --no-install-recommends \
            build-essential cmake ninja-build g++-12 nvidia-cuda-toolkit

      - name: Build instrumented
        run: |
          cmake -S . -B build-san -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-san -j"$(ci/jobs.sh -p asan)"

      - name: Run under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          # The tier test builds and runs sass_tier for seven architectures and some forty other programs, every one twice or
          # more; under a sanitizer that is about 2000 s. Two architectures and the one program that checks the interpreter
          # steps keep the sanitizer on the tier's code; the other programs run under it, tier on and off, in e2e_sass_archs,
          # and the plain builds run the full matrix.
          VGPU_TIER_ARCHS: "sm_80 sm_90"
          VGPU_TIER_PROGRAMS: "sass_tier_steps:75"
        # -j2 (fewer when under 12 GiB are free, ci/jobs.sh): 534 tests, 1840 s
        # one at a time in run 38424481981 (2031 s in 38612576048), the
        # longest 173 s, on a 24-core machine that otherwise idles through them;
        # the pool has one runner (server2-1), so each minute here is also a
        # minute the jobs queued behind this one wait. The ml job runs these
        # tests at -j2 on every run, and the tests that take the nvcc_memory lock
        # (CMakeLists.txt) still run one at a time.
        run: ctest --test-dir build-san --output-on-failure -j"$(ci/jobs.sh -g 6 -m 2)" -E pantheon_workloads

      # The jobs run as root in the container, in a workspace that belongs to the runner's
      # user. On a runner that lasts (the burst pool) what they leave there is root's, and the
      # next job's checkout cannot clean it. Hand it back, whatever the outcome.
      - name: Return the workspace to the runner's user
        if: always() && job.container.id
        run: chown -R "$(stat -c %u:%g "$GITHUB_WORKSPACE/..")" "$GITHUB_WORKSPACE" || true

  threads:
    name: ThreadSanitizer
    # GitHub's hosted runner unless the repository variable BURST_RUNS_ON names
    # another pool, e.g. ["pantheonsim-burst"]: AWS instances
    # started while the pull request backlog is long and terminated when it is
    # empty. This is one of the three long jobs (SASS, ASan, TSan) that go to
    # the pool, and it runs in the toolchain image there as it does here.
    runs-on: ${{ fromJSON(vars.CONTAINER_RUNS_ON || vars.BURST_RUNS_ON || '"ubuntu-24.04"') }}
    # The toolchain image (.github/ci-image), or, when there is none, the
    # runner itself with the install step below.
    needs: image
    container:
      image: ${{ needs.image.outputs.cuda12_0 }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      # TSan's setarch -R needs personality() (seccomp), LeakSanitizer
      # ptrace; the IPC tests more than Docker's 64 MB of /dev/shm.
      options: --shm-size=2g --cap-add=SYS_PTRACE --security-opt seccomp=unconfined ${{ vars.BURST_CONTAINER_OPTIONS }}
    permissions: { contents: read, packages: read, actions: write, pull-requests: read }  # pr-guard cancels a run whose PR conflicts
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/pr-guard

      # This job needs a lot of memory, and on a shared runner another job may
      # hold most of it. Wait up to 30 minutes for the memory (CI_MEM_WAIT_SECS: a peak
      # from another job usually passes), then fail here, alone, if this one cannot fit, rather than
      # take the machine down part-way (the minimums are in ci/jobs.sh).
      - name: Check the memory
        env:
          CI_MEM_WAIT_SECS: '1800'
        run: ci/jobs.sh --check tsan

      # The checkout belongs to the runner's user and the job runs as root in
      # the container: trust this one repository, or git refuses it (tests ask
      # git which files are tracked). actions/checkout's own exception lasts
      # only for its step.
      - name: Trust the checkout
        if: job.container.id
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install toolchain
        if: ${{ !job.container.id }}
        run: |
          sudo flock /tmp/pool-apt.lock apt-get update -qq
          sudo flock /tmp/pool-apt.lock apt-get install -y -qq --no-install-recommends \
            build-essential cmake ninja-build g++-12 nvidia-cuda-toolkit

      - name: Build instrumented
        run: |
          cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          cmake --build build-tsan -j"$(ci/jobs.sh -p tsan)"

      - name: Run under TSan
        # TSan cannot map its shadow memory under this kernel's ASLR entropy, so
        # the run needs randomization off. Without this every test aborts with
        # "unexpected memory mapping" before it starts.
        #
        # -j2 (fewer when under 12 GiB are free, ci/jobs.sh): 534 tests, 1436 s
        # one at a time in run 38424481981 (1586 s in 38612576048), the longest
        # 150 s, on a 24-core machine that otherwise idles through them. See the
        # ASan job above for why it is safe.
        #
        # Left out: the golden-digest tests of the AMD executor and the video codecs. They run on one thread (nothing in their
        # sources starts one), and ThreadSanitizer only reports races between threads, so they took about 1500 s of this job
        # (it runs one test at a time) and could find nothing. ASan and UBSan run them, and so do the plain builds.
        env:
          VGPU_TIER_ARCHS: "sm_80 sm_90"
          VGPU_TIER_PROGRAMS: "sass_tier_steps:75"
        run: |
          single_thread='test_amd_gcn_same_bits|test_amd_gcn_tier_same_bits|test_amd_gcn_memory_same_bits|test_amd_gcn_packed_same_bits|test_amd_matrix_fast|test_decode_same_bits|test_hevc_decode|test_h264_decode|test_mpeg2_decode|test_nvenc_.*'
          setarch "$(uname -m)" -R ctest --test-dir build-tsan --output-on-failure -j"$(ci/jobs.sh -g 6 -m 2)" -E "^(pantheon_workloads|$single_thread)$"

      # The jobs run as root in the container, in a workspace that belongs to the runner's
      # user. On a runner that lasts (the burst pool) what they leave there is root's, and the
      # next job's checkout cannot clean it. Hand it back, whatever the outcome.
      - name: Return the workspace to the runner's user
        if: always() && job.container.id
        run: chown -R "$(stat -c %u:%g "$GITHUB_WORKSPACE/..")" "$GITHUB_WORKSPACE" || true

