  source: "gc_9_4_3_offset.h regGRBM_STATUS 0x0004, GC segment 0"
  fields: ["3:0 me0pipe0_cmdfifo_avail", "12 db_clean", "13 cb_clean", "14 ta_busy", "19 ia_busy", "20 sx_busy", "22 spi_busy", "23 bci_busy", "24 sc_busy", "25 pa_busy", "26 db_busy", "29 cp_busy", "30 cb_busy", "31 gui_active"]
