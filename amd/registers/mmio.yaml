# ---- UMC (memory controller) ECC, thermal ----------------------------------------
# The UMC and THM bases (UMC instance 0 segment 0 at 0x14000, THM segment 0 at
# 0x16600) are Aldebaran's from aldebaran_ip_offset.h: assumed for MI300, not
# checked on a card, like the rest of this file. The register layouts are
# umc_6_7_0 (Aldebaran's UMC) and thm_13_0_2. Channels 4-7 of instance 0 (BASE_IDX 1,
# segment 1 at 0x54000) and instances 1-3 (0x94000 and up) lie beyond this 512 KiB BAR5
# and are reached through the indirect index/data pair, which is not mapped; so
# only channels 0-3 of instance 0 are here. ECC counts follow the injected RAS
# counts (`vgpu fault`): the card's device-memory total is spread over the four
# mapped channels in turn -- how a real card attributes errors to channels is
# not modelled. The 64-bit MCA STATUS is two 32-bit registers, low then high.

umc0_ch0_ecc_ctrl:
  offset: "0x5014c"
  width: 32
  access: rw
  write_mask: "0x00003503"
  reset: "0x00000401"
  source: "umc_6_7_0_offset.h regUMCCH0_0_EccCtrl 0x0053, UMC instance 0 segment 0; fields umc_6_7_0_sh_mask.h UMCCH0_0_EccCtrl__*"
  fields: ["0 wr_ecc_en", "1 ecc_replay_en", "8 uc_fatal_en", "10 rd_ecc_en", "12 poison_fatal_dis", "13 poison_inhibit"]
  surfaces: [umr, amdgpu ras]
  status: model
  measured: "not measured; the base is Aldebaran's, and the power-on value (write and read ECC on) is a model"

