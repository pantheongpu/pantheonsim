# AMD Radeon RX 6800 (amd/rx6800): its registers at power-on.
#
# Every register of each space the GPU has, where it has it, and the value it
# reads as. Every simulated GPU of this model starts from these values.
#
#   REGISTER: [OFFSET, WIDTH, ACCESS, VALUE]           a fixed value
#   REGISTER: [OFFSET, WIDTH, ACCESS, VALUE, BACKING]  follows the device's state
#                                                     (the link, BARs, error status,
#                                                     engines); VALUE is at power-on
#
# Generated by `vgpu regs export amd/rx6800` from the register database
# (registers/pci-config.yaml, <vendor>/registers/mmio.yaml) and the profile.
# Change those and regenerate: a test fails
# when this file and what they give differ. docs/registers.md has the details.

profile: amd/rx6800
pci_device_id: 0x73bf
layout: amd-rx6800

