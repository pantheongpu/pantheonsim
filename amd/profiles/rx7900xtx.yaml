# VirtualGPU device profile: AMD Radeon RX 7900 XTX.
# Values from public AMD documentation. verified: false means nothing here has
# been confirmed by hardware characterization yet -- treat as placeholders.
#
# The first RDNA part here: gfx1100 (RDNA3, Navi 31), a consumer card whose
# kernels run 32 lanes to a wave, as HIP builds them for it. HIP counts its
# compute units in pairs (workgroup processors): 48 of the card's 96.
id: amd/rx7900xtx
vendor: amd
model: "AMD Radeon RX 7900 XTX"
architecture: rdna3
gcn_arch: "gfx1100"
# Consumer RDNA parts have neither SRAM ECC nor XNACK to report.
gcn_arch_full: "gfx1100"
warp_size: 32
vram_bytes: 25753026560        # 24 GiB of GDDR6 (HIP reports 25,753,026,560 bytes usable)
verified: false
limits:
  max_threads_per_block: 1024
  max_block_dim: [1024, 1024, 1024]
  max_grid_dim: [2147483647, 2147483647, 2147483647]
  shared_mem_per_block_bytes: 65536
  shared_mem_per_block_optin_bytes: 65536
  registers_per_block: 65536
  multiprocessors: 48          # workgroup processors, as HIP counts them; 96 compute units
  registers_per_sm: 65536
  max_threads_per_sm: 2048
  max_blocks_per_sm: 32
  max_registers_per_thread: 255
  shared_mem_per_sm: 131072    # 128 KB of LDS per workgroup processor
  l2_cache_bytes: 6291456      # 6 MB L2 (the 96 MB Infinity Cache behind it HIP does not report)
features:
  fp16: true
  bf16: true
  fp64: true
  tensor_cores: true           # WMMA
telemetry:
  power_limit_w: 355           # total board power (AMD specifications)
  sm_clock_max_mhz: 2500       # boost clock
  mem_clock_max_mhz: 2500      # 20 Gbps GDDR6
  temperature_max_c: 110
  pci_vendor_id: 4098          # 0x1002 AMD
  pci_device_id: 29772         # 0x744c Navi 31 [Radeon RX 7900 XT/7900 XTX]
  ecc: false                   # consumer GDDR6, no ECC
  memory: gddr                 # GDDR6
  memory_temperature: true     # rocm-smi reports a memory sensor on RDNA3 boards
  pcie_link: "Gen4 x16"
