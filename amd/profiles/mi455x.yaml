# VirtualGPU device profile: AMD Instinct MI455X (CDNA 5, gfx1250).
# Values from public AMD announcements and LLVM. verified: false means nothing here has
# been confirmed against a physical card -- none exists to check against, and AMD has not
# published the rest (compute-unit count in HIP's terms, clocks, board power, PCI ids).
# Those are marked "placeholder" below and chosen, not read from anywhere.
#
# What is sourced: 432 GB of HBM4 and 19.6 TB/s (AMD, Helios announcement); 256 workgroup
# processors, 32 to each of 8 compute dies; wave32 only; 192 MB of last-level cache. The
# 320 KB of LDS a work-group is LLVM's limit for gfx1250 (llc -mcpu=gfx1250 refuses a kernel
# that asks for more).
id: amd/mi455x
vendor: amd
model: "AMD Instinct MI455X"
architecture: cdna5
gcn_arch: "gfx1250"
# As HIP would name it with the features LLVM's gfx1250 ships with (xnack and sramecc
# are both advertised by the target).
gcn_arch_full: "gfx1250:sramecc+:xnack-"
warp_size: 32
vram_bytes: 463856467968       # 432 GiB
verified: false
limits:
  max_threads_per_block: 1024
  max_block_dim: [1024, 1024, 1024]
  max_grid_dim: [2147483647, 2147483647, 2147483647]
  shared_mem_per_block_bytes: 327680
  shared_mem_per_block_optin_bytes: 327680
  registers_per_block: 65536   # placeholder
  multiprocessors: 256         # workgroup processors, as HIP counts them on a gfx12 part
  registers_per_sm: 65536      # placeholder
  max_threads_per_sm: 2048     # placeholder
  max_blocks_per_sm: 32        # placeholder
  max_registers_per_thread: 255   # placeholder
  shared_mem_per_sm: 327680
  l2_cache_bytes: 4194304      # placeholder
features:
  fp16: true
  bf16: true
  fp64: true
  tensor_cores: true           # WMMA
telemetry:
  power_limit_w: 1800          # placeholder: AMD has not published a board power
  sm_clock_max_mhz: 2400       # placeholder
  mem_clock_max_mhz: 3200      # derived: 19.6 TB/s over twelve 2048-bit HBM4 stacks, double data rate
  temperature_max_c: 100       # placeholder
  pci_vendor_id: 4098          # 0x1002 AMD
  pci_device_id: 4688          # 0x1250, NOT a real id: AMD has not published MI455X's
  ecc: true                    # HBM with ECC (assumed like every other Instinct part)
  memory: hbm
  memory_temperature: true
  pcie_link: "Gen6 x16"        # placeholder
