# VirtualGPU device profile: AMD Instinct AMD Instinct MI350X.
# Values from public AMD documentation. verified: false means nothing here has
# been confirmed by hardware characterization yet -- treat as placeholders.
#
# Kernels built for gfx950 run on it (amd/README.md, "gfx950"). Its LDS is
# CDNA4's 160 KB a work-group, the 163840 bytes LLVM's gfx950 target gives
# as addressable local memory.
id: amd/mi350x
vendor: amd
model: "AMD Instinct MI350X"
architecture: cdna4
# AMD parts have no compute capability; the gfx target is what identifies them.
# Placeholder, like the rest of this file: not read from a device.
gcn_arch: "gfx950"
# As HIP names it, with the features it runs with: SRAM ECC on, XNACK off,
# the settings an Instinct part ships with.
gcn_arch_full: "gfx950:sramecc+:xnack-"
warp_size: 64
vram_bytes: 309237645312
verified: false
limits:
  max_threads_per_block: 1024
  max_block_dim: [1024, 1024, 1024]
  max_grid_dim: [2147483647, 2147483647, 2147483647]
  shared_mem_per_block_bytes: 163840
  shared_mem_per_block_optin_bytes: 163840
  registers_per_block: 65536
  multiprocessors: 256
  registers_per_sm: 65536
  max_threads_per_sm: 2048
  max_blocks_per_sm: 32
  max_registers_per_thread: 255
  shared_mem_per_sm: 163840
features:
  fp16: true
  bf16: true
  fp64: true
  tensor_cores: true
telemetry:
  power_limit_w: 1000
  sm_clock_max_mhz: 2100
  mem_clock_max_mhz: 5200
  temperature_max_c: 100
  pci_vendor_id: 4098          # 0x1002 AMD
  pci_device_id: 30032        # 0x7550 [Instinct MI350X] -- not in the local pci.ids
  ecc: true                    # HBM with ECC, always on (AMD datasheet)
  memory: hbm                  # rows are remapped on failure
  memory_temperature: true     # rocm-smi reports an HBM sensor; unchecked on a real card
  pcie_link: "Gen5 x16"        # datasheet; unchecked on a real card
