# VirtualGPU device profile: AMD Radeon RX 6700 XT.
# Read from a card (2026-10-09, ROCm 7.2.0, amdgpu on Linux 7.0): rocminfo, HIP's device
# properties (amd/tools/characterize-hip.cpp), amd-smi, rocm-smi, lspci and the KFD topology,
# kept in amd/registers/measurements/rx6700xt/. So verified: true. What no tool reports (the
# per-multiprocessor block limit) is the RX 6900 XT profile's.
#
# gfx1031 (RDNA2, Navi 22): the same instruction set as gfx1030 on a smaller die, with 40 compute
# units, a 192-bit bus and 96 MB of Infinity Cache. Kernels run 32 lanes to a wave, and it has no
# matrix instructions, so PyTorch's matrix products run on its vector units. HIP counts its compute
# units in pairs (workgroup processors): 20 of the card's 40.
id: amd/rx6700xt
vendor: amd
model: "AMD Radeon RX 6700 XT"
architecture: rdna2
gcn_arch: "gfx1031"
# Consumer RDNA parts have neither SRAM ECC nor XNACK to report.
gcn_arch_full: "gfx1031"
warp_size: 32
vram_bytes: 12868124672        # 12 GiB of GDDR6 (HIP reports 12,868,124,672 bytes usable)
verified: true
limits:
  max_threads_per_block: 1024
  max_block_dim: [1024, 1024, 1024]
  max_grid_dim: [2147483647, 65536, 65536]   # as HIP reports it: y and z are 65536, not 2^31-1
  shared_mem_per_block_bytes: 65536
  shared_mem_per_block_optin_bytes: 65536
  registers_per_block: 131072
  multiprocessors: 20          # workgroup processors, as HIP counts them; 40 compute units
  registers_per_sm: 131072
  max_threads_per_sm: 2048
  max_blocks_per_sm: 32        # not exposed by HIP: the RX 6900 XT profile's
  max_registers_per_thread: 256
  shared_mem_per_sm: 65536     # 64 KB of LDS per workgroup processor, as HIP and HSA report
  l2_cache_bytes: 3145728      # 3 MB L2 (the 96 MB Infinity Cache behind it HIP does not report)
features:
  fp16: true
  bf16: true                   # in software: converted to and from fp32
  fp64: true
  tensor_cores: false          # no WMMA before RDNA3
telemetry:
  power_limit_w: 186           # amd-smi: the board's power cap (174 W is the lowest it can be set)
  sm_clock_max_mhz: 2855       # the top of the shader clock table
  mem_clock_max_mhz: 2000      # 16 Gbps GDDR6, as the other GDDR6 profiles give it (the card's mclk table tops out at 1000 MHz)
  temperature_max_c: 110       # the junction slowdown threshold (edge 110, memory 105)
  pci_vendor_id: 4098          # 0x1002 AMD
  pci_device_id: 29663         # 0x73df Navi 22 [Radeon RX 6700/6700 XT/6750 XT / 6800M/6850M XT], revision c1, subsystem 1002:0e36
  ecc: false                   # consumer GDDR6, no ECC
  memory: gddr                 # GDDR6, Samsung, 192 bits
  memory_temperature: true     # rocm-smi reports a memory sensor on RDNA2 boards
  pcie_link: "Gen4 x16"
