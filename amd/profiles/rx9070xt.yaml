# VirtualGPU device profile: AMD Radeon RX 9070 XT.
# Values from public AMD documentation. verified: false means nothing here has
# been confirmed by hardware characterization yet -- treat as placeholders.
#
# RDNA4: gfx1201 (Navi 48), a consumer card whose kernels run 32 lanes to a
# wave, as HIP builds them for it. HIP counts its compute units in pairs
# (workgroup processors): 32 of the card's 64.
id: amd/rx9070xt
vendor: amd
model: "AMD Radeon RX 9070 XT"
architecture: rdna4
gcn_arch: "gfx1201"
gcn_arch_full: "gfx1201"
warp_size: 32
vram_bytes: 17163091968        # 16 GiB of GDDR6, less what the driver keeps
verified: false
limits:
  max_threads_per_block: 1024
  max_block_dim: [1024, 1024, 1024]
  max_grid_dim: [2147483647, 2147483647, 2147483647]
  shared_mem_per_block_bytes: 65536
  shared_mem_per_block_optin_bytes: 65536
  registers_per_block: 65536
  multiprocessors: 32          # workgroup processors, as HIP counts them; 64 compute units
  registers_per_sm: 65536
  max_threads_per_sm: 2048
  max_blocks_per_sm: 32
  max_registers_per_thread: 255
  shared_mem_per_sm: 131072    # 128 KB of LDS per workgroup processor
  l2_cache_bytes: 8388608      # 8 MB L2 (the 64 MB Infinity Cache behind it HIP does not report)
features:
  fp16: true
  bf16: true
  fp64: true
  tensor_cores: true           # WMMA, fp8 included
telemetry:
  power_limit_w: 304           # total board power (AMD specifications)
  sm_clock_max_mhz: 2970       # boost clock
  mem_clock_max_mhz: 2518      # 20 Gbps GDDR6
  temperature_max_c: 110
  pci_vendor_id: 4098          # 0x1002 AMD
  pci_device_id: 30032         # 0x7550 Navi 48 [Radeon RX 9070 XT]
  ecc: false                   # consumer GDDR6, no ECC
  memory: gddr                 # GDDR6
  memory_temperature: true
  pcie_link: "Gen5 x16"
