# VirtualGPU device profile: AMD Radeon RX 6900 XT.
# Values from public AMD documentation. verified: false means nothing here has
# been confirmed by hardware characterization yet -- treat as placeholders.
#
# gfx1030 (RDNA2, Navi 21), the generation before the RX 7900 XTX: kernels
# run 32 lanes to a wave, and it has no matrix instructions, so PyTorch's
# matrix products run on its vector units. HIP counts its compute units in
# pairs (workgroup processors): 40 of the card's 80.
id: amd/rx6900xt
vendor: amd
model: "AMD Radeon RX 6900 XT"
architecture: rdna2
gcn_arch: "gfx1030"
# Consumer RDNA parts have neither SRAM ECC nor XNACK to report.
gcn_arch_full: "gfx1030"
warp_size: 32
vram_bytes: 17163091968        # 16 GiB of GDDR6 (HIP reports 17,163,091,968 bytes usable)
verified: false
limits:
  max_threads_per_block: 1024
  max_block_dim: [1024, 1024, 1024]
  max_grid_dim: [2147483647, 2147483647, 2147483647]
  shared_mem_per_block_bytes: 65536
  shared_mem_per_block_optin_bytes: 65536
  registers_per_block: 65536
  multiprocessors: 40          # workgroup processors, as HIP counts them; 80 compute units
  registers_per_sm: 65536
  max_threads_per_sm: 2048
  max_blocks_per_sm: 32
  max_registers_per_thread: 255
  shared_mem_per_sm: 131072    # 128 KB of LDS per workgroup processor
  l2_cache_bytes: 4194304      # 4 MB L2 (the 128 MB Infinity Cache behind it HIP does not report)
features:
  fp16: true
  bf16: true                   # in software: converted to and from fp32
  fp64: true
  tensor_cores: false          # no WMMA before RDNA3
telemetry:
  power_limit_w: 300           # total board power (AMD specifications)
  sm_clock_max_mhz: 2250       # boost clock
  mem_clock_max_mhz: 2000      # 16 Gbps GDDR6
  temperature_max_c: 110
  pci_vendor_id: 4098          # 0x1002 AMD
  pci_device_id: 29631         # 0x73bf Navi 21 [Radeon RX 6800/6800 XT/6900 XT]
  ecc: false                   # consumer GDDR6, no ECC
  memory: gddr                 # GDDR6
  memory_temperature: true     # rocm-smi reports a memory sensor on RDNA2 boards
  pcie_link: "Gen4 x16"
