  expansion_rom:               [0x030, 32, ro, 0x00000000]
  capabilities_pointer:        [0x034, 8, ro, 0x60]
  interrupt_line:              [0x03c, 8, rw, 0x0b]
  interrupt_pin:               [0x03d, 8, ro, 0x01]
  pm_header:                   [0x060, 16, ro, 0x6801]
