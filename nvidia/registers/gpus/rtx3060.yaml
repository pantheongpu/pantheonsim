  revision:                    [0x008, 8, ro, 0xa1]
  class_code:                  [0x009, 24, ro, 0x030000]
  cache_line_size:             [0x00c, 8, rw, 0x00]
  latency_timer:               [0x00d, 8, ro, 0x00]
  header_type:                 [0x00e, 8, ro, 0x80]
  bar0:                        [0x010, 32, bar, 0xe0000000, bar.0]
  bar1:                        [0x014, 32, bar, 0x0000000c, bar.1]
