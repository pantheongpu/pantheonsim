# The MMU fault buffers (replayable, then non-replayable): where software has read up
# to (GET) and where the MMU has written to (PUT). No fault is ever raised here, so
# PUT stays at the header's reset value, zero, and GET keeps its pointer field.
# The corrupted and overflow bits (30, 31) are write-1-to-clear in the header and
# never set here.
pfb_pri_mmu_fault_buffer_get_0:
  offset: "0x100e2c"
  width: 32
  access: rw
