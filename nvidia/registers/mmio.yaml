# The count is what `vgpu fault` injected as an uncorrectable device-memory error
# since the driver loaded. The injector counts the whole memory, not partitions, so
# it is shown on counter 0 and the others read zero. As on hardware, writing the
# counter sets it (write 0 to clear): it counts up from what was written. A model:
