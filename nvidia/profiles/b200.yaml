# VirtualGPU device profile: NVIDIA B200 (Blackwell).
# Public documentation values (sm_100). Blackwell public data is thinner than
# Hopper's; several values here are best-effort placeholders and MUST be
# revisited by hardware characterization. verified: false.
id: nvidia/b200
vendor: nvidia
model: "NVIDIA B200"
architecture: blackwell
compute_capability: "10.0"
warp_size: 32
vram_bytes: 192265846784         # capped at the measured framebuffer -- see below
# The spec sheet's "192 GB" is decimal (183105 MiB) and was stored here as
# 192 GiB (196608 MiB) -- 13 GB more than a real B200 has in total, which
# nvidia-smi on one showed as 183359 MiB (driver 580.105.08). totalGlobalMem
# is smaller than the framebuffer by the driver's reserve and has not been
# measured yet, so this is an upper bound rather than a characterization.
verified: false
limits:
  max_threads_per_block: 1024
  max_block_dim: [1024, 1024, 64]
  max_grid_dim: [2147483647, 65535, 65535]
  shared_mem_per_block_bytes: 49152
  shared_mem_per_block_optin_bytes: 232448   # 227 KiB (sm_100)
  registers_per_block: 65536
  multiprocessors: 148
  registers_per_sm: 65536
  max_threads_per_sm: 2048
  max_blocks_per_sm: 32
  max_registers_per_thread: 255
  shared_mem_per_sm: 233472
features:
  fp16: true
  bf16: true
  fp64: true
  tensor_cores: true

# Presentation-only values for monitoring tools (nvidia-smi / vgpu smi).
# NOT used by the execution engine -- VirtualGPU does not model performance.
# Public spec-sheet figures; PCI ids from the public NVIDIA device list.
telemetry:
  framebuffer_mb: 183359          # nvidia-smi total on real cards (1 run in the benchmark database)
  power_limit_w: 1000
  sm_clock_max_mhz: 1965
  mem_clock_max_mhz: 4000
  temperature_max_c: 90
  pci_vendor_id: 4318          # 0x10DE NVIDIA
  pci_device_id: 10497        # 0x2901 [B200] -- NVIDIA's open GPU kernel modules name table (g_nv_name_released.h)
  ecc: true                    # supported and on by default (NVIDIA datasheet)
  memory: hbm                  # rows are remapped on failure
  memory_temperature: true     # reported on every real run in the benchmark database
  pcie_link: "Gen5 x16"        # most common link on real cards (30 runs in the benchmark database)
  nvlink: "NVLink5 x18"        # data sheet: SXM part, NVLink generation 5, 18 links

# What CUDA reports of the card beyond its limits (cudaDeviceProp, cuDeviceGetAttribute).
# Datasheet: eight HBM3e stacks. The L2 size is not published as a figure CUDA would report, so it is left unset.
cuda:
  memory_bus_width_bits: 8192

# Numerics: the sum this device's tensor core makes of f16, bf16 and tf32 products (wmma, mma.sync, HMMA). The engines read it
# from here. `provenance` gives each value one class (measured | documented | inferred | unknown) and `evidence` what the class
# rests on. Schema: nvidia/docs/profiles.md. The rule and every card run: docs/matrix-numerics.md.
numerics:
  tensor_sum: hopper               # sequential | ampere | hopper
  tensor_sum_chunk: 16             # products to a chunk, f16 and bf16
  tensor_sum_chunk_tf32: 8         # ... tf32
  tensor_sum_grid: 26              # a chunk's terms are cut at 2^(top - 26)
  tensor_sum_fp8: via_f16          # sequential | ada | via_f16: the e4m3 and e5m2 forms (mma.sync), summed as f16 ones are
provenance:
  inferred: [numerics.tensor_sum, numerics.tensor_sum_chunk, numerics.tensor_sum_chunk_tf32, numerics.tensor_sum_grid, numerics.tensor_sum_fp8]
evidence:
  numerics: "inferred from data recorded by others on a B200 (compute capability 10.0), NOT run by us on a card. Khattak and Mikaitis (arXiv 2512.07004) recorded 20,000 test vectors on a B200 (f16 with an f32 accumulator, f16 with an f16 accumulator, bf16, tf32); this rule (chunks of 16, tf32 8, grid 26: the Hopper rule, also given to Blackwell by MMA-Sim, Xie et al., arXiv 2511.10909) reproduces all 20,000 and the sequential f32 sum mismatches 8,020. mma.sync, wmma and HMMA only; tcgen05.mma is not covered. VGPU_TC_EXACT=0 gives the earlier sequential sum back. docs/matrix-numerics.md, docs/numerics/tcpapers.md"
  numerics.tensor_sum_fp8: "inferred from data recorded by others on a B200, NOT run by us on a card. ptxas turns an FP8 mma.sync for sm_100 into a conversion to f16 and HMMA (F2FP.F16.E4M3.UNPACK_B in the SASS), so the device's f16 rule sums the products. The 5,000 e4m3 and 5,000 e5m2 vectors, f32 and f16 accumulators, that Khattak and Mikaitis (arXiv 2512.07004) recorded on a B200 are reproduced by it. docs/numerics/fp8-vectors.md, docs/matrix-numerics.md"
