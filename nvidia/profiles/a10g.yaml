# VirtualGPU device profile: NVIDIA A10G
# Generated by nvidia/tools/characterize.cu from a physical device.
# Every value below was read from the hardware, not a datasheet.
id: nvidia/a10g
vendor: nvidia
model: "NVIDIA A10G"
architecture: ampere
compute_capability: "8.6"
warp_size: 32
vram_bytes: 23686938624
verified: true
limits:
  max_threads_per_block: 1024
  max_block_dim: [1024, 1024, 64]
  max_grid_dim: [2147483647, 65535, 65535]
  shared_mem_per_block_bytes: 49152
  shared_mem_per_block_optin_bytes: 101376
  registers_per_block: 65536
  multiprocessors: 80
  registers_per_sm: 65536
  max_threads_per_sm: 1536
  max_blocks_per_sm: 16
  max_registers_per_thread: 255
  shared_mem_per_sm: 102400
  l2_cache_bytes: 6291456          # GA102 datasheet
features:
  fp16: true
  bf16: true
  fp64: true
  tensor_cores: true
telemetry:
  framebuffer_mb: 23028          # nvidia-smi total on real cards (592 runs in the benchmark database)
  power_limit_w: 300
  sm_clock_max_mhz: 1710
  mem_clock_max_mhz: 6251
  temperature_max_c: 95
  pci_vendor_id: 4318          # 0x10DE
  pci_device_id: 8759          # 0x2237
  ecc: true                    # supported and on by default (NVIDIA datasheet)
  memory: gddr                 # GDDR; Ampere and later remap rows rather than retire pages (see telemetry.cpp)
  pcie_link: "Gen4 x8"         # most common link on real cards (592 runs in the benchmark database)

# What CUDA reports of the card beyond its limits (cudaDeviceProp, cuDeviceGetAttribute).
# Datasheet: GA102 memory interface and 6 MB L2. The persisting L2 maximum is the 3060's ratio (11/16 of L2) for compute capability 8.6.
cuda:
  memory_bus_width_bits: 384
  persisting_l2_bytes: 4325376

# Numerics: the sum this device's tensor core makes of f16, bf16 and tf32 products (wmma, mma.sync, HMMA). The engines read it
# from here. `provenance` gives each value one class (measured | documented | inferred | unknown) and `evidence` what the class
# rests on. Schema: nvidia/docs/profiles.md. The rule and every card run: docs/matrix-numerics.md.
numerics:
  tensor_sum: ampere               # sequential | ampere | hopper
  tensor_sum_chunk: 8              # products to a chunk, f16 and bf16
  tensor_sum_chunk_tf32: 4         # ... tf32
  tensor_sum_grid: 25              # a chunk's terms are cut at 2^(top - 25)
  tensor_sum_m8n8k4: chain_c_last   # sequential | volta | chain_c_last: mma.m8n8k4 (f32 accumulator; PTX engine)
  tensor_sum_sparse: ampere         # sequential | ampere: mma.sp / HMMA.SP with f16, bf16, tf32 operands
  cublas_splitk: a10g               # none | t4 | a10g: the cuBLAS split-K table (nvidia/src/cublas_splitk_a10g.inc)
provenance:
  measured: [numerics.tensor_sum, numerics.tensor_sum_chunk, numerics.tensor_sum_chunk_tf32, numerics.tensor_sum_grid, numerics.tensor_sum_m8n8k4, numerics.tensor_sum_sparse, numerics.cublas_splitk]
evidence:
  numerics.cublas_splitk: "card: A10G (AWS g5.xlarge, 80 multiprocessors), driver 595.112.07, CUDA 13.0.88 cuBLAS, 2026-11-25 and 2026-11-26. tools/cublas_splitk/split_probe.cu (a summation-tree probe) FP16 and BF16 into FP32, FP16 into FP16, and TF32 (FAST_TF32) surveyed cublasGemmEx over m, n in 32..1024 and k in 64..8192, all four transposes: where the slices are chains of tensor-core chunks added in order the table lists the slice length, each row confirmed bit for bit on random inputs with alpha = 1.3, beta = 0.7 (tools/cublas_splitk/classify.cu) when m n k <= 2^25. Products off that grid are not known and are the plain chain; products whose tree is another kind (an interleaved k-parallel accumulator, partial sums rounded to half precision) are not in the table. nvidia/docs/cublas.md. Vectors: nvidia/tests/data/cublas_tc_gemm.a10g.txt (the products of the e2e_cublas_tc_gemm cases, checksums as the card printed them)"
  numerics: "card: NVIDIA A10G (this model), AWS; driver: 595.112.07; toolkit: CUDA 13.0; date: 2026-11-15. Both probes print the RTX 3060 lines (nvidia/tests/data/simd_lane_forms.rtx3060.txt, float_half_forms.rtx3060.txt), 60 of 60 and 169 of 169; FTTN. docs/matrix-numerics.md"
  numerics.tensor_sum_m8n8k4: "card: A10G (AWS g5.xlarge), driver 595.112.07, nvcc 13.0.88, 2026-11-23. tools/tcpapers/m8n8k4_vectors.cu ran the 5,000 f32-accumulator vectors Khattak and Mikaitis recorded on a V100 (arXiv 2512.07004) through an sm_86 build: the results are D = (((p0 + p1) + p2) + p3) + C in f32, each add rounded to nearest even, 5,000 of 5,000, and 800 more of our own inputs (subnormals, cancellation, large and small terms) 800 of 800. ptxas emulates the form on sm_80 and later, so this is code, not a tensor core. An f16 accumulator is NOT this sum (a different order: 796 of 800 fit c + p0 + p1 + ...) and keeps the sequential sum here. Data: nvidia/tests/data/tcpapers/m8n8k4.a10g.fp32.txt. docs/numerics/m8n8k4-and-sparse.md"
  numerics.tensor_sum_sparse: "card: A10G (AWS g5.xlarge), driver 595.112.07, nvcc 13.0.88, 2026-11-23. tools/tcpapers/sparse_vectors.cu ran 800 vectors a form of mma.sp m16n8k16 and m16n8k32 (f16, bf16, f16 accumulator) and m16n8k8 and m16n8k16 (tf32), 2:4 and 1:2 positions chosen by uniform metadata, subnormals and cancellation among the inputs: the Ampere rule (grid 25) over the STORED products, chunks of 8 (tf32 4), reproduces every finite result, 800 of 800 in each of the eight modes (the first 300 of each: nvidia/tests/data/tcpapers/sparse/a10g.f16k32.txt and its seven siblings). docs/numerics/m8n8k4-and-sparse.md"
