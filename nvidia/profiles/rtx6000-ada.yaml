# VirtualGPU device profile: NVIDIA RTX 6000 Ada Generation (Ada Lovelace, AD102, sm_89).
# Public values; verified: false -- nothing here has been measured on a card.
# Where each value comes from:
#   - compute capability 8.9: NVIDIA's CUDA GPUs table (developer.nvidia.com/cuda-gpus).
#   - SMs 142: NVIDIA's RTX 6000 Ada datasheet (142 RT Cores, 568 Tensor Cores, 18,176 CUDA cores at 128 an SM) and the RTX
#     Blackwell GPU Architecture whitepaper (v1.1), Table 1.
#   - memory 48 GB GDDR6 with ECC on a 384-bit interface, 300 W, PCIe Gen 4: the datasheet and NVIDIA's RTX 6000 page. NVIDIA's "GB" for graphics memory is binary (see rtx2080ti.yaml),
#     so vram_bytes is 49152 MiB; a real card's nvidia-smi total is a little smaller, so this is an upper bound.
#   - boost clock 2505 MHz and the 20 Gbps data rate: the whitepaper's Table 1. (The same table gives 1008 GB/sec; 20 Gbps on 384 bits is
#     960 GB/s, the figure on NVIDIA's RTX 6000 Ada page and in third-party listings, so the clock follows the data rate.)
#   - PCI device 0x26B1, "NVIDIA RTX 6000 Ada Generation", from the name table in NVIDIA's open GPU kernel modules (g_nv_name_released.h,
#     main at ca2d03e, 2026-10-07).
#   - Per-SM limits are compute capability 8.9's, the same as nvidia/l4 and nvidia/l40s, which were read from physical cards.
id: nvidia/rtx6000-ada
vendor: nvidia
model: "NVIDIA RTX 6000 Ada Generation"
architecture: ada
compute_capability: "8.9"
warp_size: 32
vram_bytes: 51539607552          # 49152 MiB; an upper bound, as for the B200
verified: false
limits:
  max_threads_per_block: 1024
  max_block_dim: [1024, 1024, 64]
  max_grid_dim: [2147483647, 65535, 65535]
  shared_mem_per_block_bytes: 49152
  shared_mem_per_block_optin_bytes: 101376
  registers_per_block: 65536
  multiprocessors: 142
  registers_per_sm: 65536
  max_threads_per_sm: 1536
  max_blocks_per_sm: 24
  max_registers_per_thread: 255
  shared_mem_per_sm: 102400
  l2_cache_bytes: 100663296
features:
  fp16: true
  bf16: true
  fp64: true
  tensor_cores: true

# Presentation-only values for monitoring tools (nvidia-smi / vgpu smi).
# NOT used by the execution engine -- VirtualGPU does not model performance.
telemetry:
  framebuffer_mb: 49152          # 48 GB in MiB; not measured on a card
  power_limit_w: 300             # Max power consumption 300 W (NVIDIA's RTX 6000 Ada page)
  sm_clock_max_mhz: 2505         # boost clock (RTX Blackwell whitepaper v1.1, Table 1)
  mem_clock_max_mhz: 10000       # half of the 20 Gbps data rate in the same table; nvidia-smi reports 1 MHz more on real cards
  pci_vendor_id: 4318            # 0x10DE NVIDIA
  pci_device_id: 9905            # 0x26B1 [RTX 6000 Ada Generation]
  ecc: true                     # "48GB of error correction code (ECC) graphics memory" (datasheet)
  memory: gddr                   # GDDR; Ampere and later remap rows rather than retire pages (see telemetry.cpp)
  pcie_link: "Gen4 x16"          # datasheet: PCIe Gen 4; x16 is the slot the card is built for

# What CUDA reports of the card beyond its limits (cudaDeviceProp, cuDeviceGetAttribute).
# L2 98304 KB and the 384-bit memory interface: NVIDIA RTX Blackwell whitepaper v1.1, Table 1. Persisting L2 copied
# from nvidia/l40s (the same AD102 die and L2), whose value was read from a card (2026-10-09); NVIDIA does not publish it.
cuda:
  memory_bus_width_bits: 384
  persisting_l2_bytes: 69206016

# How the SMs are grouped: the numbers NVIDIA publishes for this part, which a cluster launch needs
# (a cluster lives in one GPC). NVIDIA does not say how many TPCs each GPC has when some are
# disabled, so the spread across GPCs is always derived (even, larger first; vgpu::GpuLayout).
# Source: NVIDIA RTX Blackwell GPU Architecture whitepaper, the RTX 6000 Ada column: GPCs 12, TPCs 71, SMs 142.
layout:
  gpcs: 12
  tpcs: 71
  sms_per_tpc: 2
