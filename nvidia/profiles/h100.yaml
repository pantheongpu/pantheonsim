# VirtualGPU device profile: NVIDIA H100 (SXM 80GB variant).
# Measured on a physical H100 SXM5 80GB (Lambda gpu_1x_h100_sxm5) with
# nvidia/tools/characterize.cu. The thermal slowdown limit is not reported by
# nvidia-smi on this part, so temperature_max_c remains the documented value.
id: nvidia/h100
vendor: nvidia
model: "NVIDIA H100 80GB HBM3"
architecture: hopper
compute_capability: "9.0"
warp_size: 32
vram_bytes: 85028896768
verified: true
limits:
  max_threads_per_block: 1024
  max_block_dim: [1024, 1024, 64]
  max_grid_dim: [2147483647, 65535, 65535]
  shared_mem_per_block_bytes: 49152
  shared_mem_per_block_optin_bytes: 232448   # 227 KiB (sm_90)
  registers_per_block: 65536
  multiprocessors: 132
  registers_per_sm: 65536
  max_threads_per_sm: 2048
  max_blocks_per_sm: 32
  max_registers_per_thread: 255
  shared_mem_per_sm: 233472
  l2_cache_bytes: 52428800          # GH100 datasheet
features:
  fp16: true
  bf16: true
  fp64: true
  tensor_cores: true

# Presentation-only values for monitoring tools (nvidia-smi / vgpu smi).
# NOT used by the execution engine -- VirtualGPU does not model performance.
# Public spec-sheet figures; PCI ids from the public NVIDIA device list.
telemetry:
  framebuffer_mb: 81559          # nvidia-smi total on real cards (516 runs in the benchmark database)
  power_limit_w: 700
  sm_clock_max_mhz: 1980
  mem_clock_max_mhz: 2619
  temperature_max_c: 87
  pci_vendor_id: 4318          # 0x10DE NVIDIA
  pci_device_id: 9008
  ecc: true                    # supported and on by default (NVIDIA datasheet)
  memory: hbm                  # rows are remapped on failure
  memory_temperature: false    # most real runs report no memory sensor
  pcie_link: "Gen5 x16"        # most common link on real cards (864 runs in the benchmark database)
  nvlink: "NVLink4 x18"        # data sheet: SXM part, NVLink generation 4, 18 links

# What CUDA reports of the card beyond its limits (cudaDeviceProp, cuDeviceGetAttribute).
# Datasheet: five active HBM3 stacks, 50 MB L2. The persisting L2 maximum is three quarters of L2, as the A100's: not read from a card.
cuda:
  memory_bus_width_bits: 5120
  persisting_l2_bytes: 39321600

# How the SMs are grouped: the numbers NVIDIA publishes for this part, which a cluster launch needs
# (a cluster lives in one GPC). NVIDIA does not say how many TPCs each GPC has when some are
# disabled, so the spread across GPCs is always derived (even, larger first; vgpu::GpuLayout).
# Source: NVIDIA Hopper Architecture In-Depth: 'H100 SXM5: 8 GPCs, 66 TPCs, 2 SMs/TPC, 132 SMs per GPU' (full GH100: 8 GPCs, 72 TPCs, 9 TPCs/GPC, 144 SMs).
layout:
  gpcs: 8
  tpcs: 66
  sms_per_tpc: 2
