# VirtualGPU device profile: NVIDIA H100 (SXM 80GB variant).
# Measured on a physical H100 SXM5 80GB (Lambda gpu_1x_h100_sxm5) with
# nvidia/tools/characterize.cu. The thermal slowdown limit is not reported by
# nvidia-smi on this part, so temperature_max_c remains the documented value.
id: nvidia/h100
vendor: nvidia
model: "NVIDIA H100 80GB HBM3"
architecture: hopper
compute_capability: "9.0"
warp_size: 32
vram_bytes: 85028896768
verified: true
limits:
  max_threads_per_block: 1024
  max_block_dim: [1024, 1024, 64]
  max_grid_dim: [2147483647, 65535, 65535]
  shared_mem_per_block_bytes: 49152
  shared_mem_per_block_optin_bytes: 232448   # 227 KiB (sm_90)
  registers_per_block: 65536
  multiprocessors: 132
  registers_per_sm: 65536
  max_threads_per_sm: 2048
  max_blocks_per_sm: 32
  max_registers_per_thread: 255
  shared_mem_per_sm: 233472
features:
  fp16: true
  bf16: true
  fp64: true
  tensor_cores: true

# Presentation-only values for monitoring tools (nvidia-smi / vgpu smi).
# NOT used by the execution engine -- VirtualGPU does not model performance.
# Public spec-sheet figures; PCI ids from the public NVIDIA device list.
telemetry:
  framebuffer_mb: 81559          # nvidia-smi total on real cards (516 runs in the benchmark database)
  power_limit_w: 700
  sm_clock_max_mhz: 1980
  mem_clock_max_mhz: 2619
  temperature_max_c: 87
  pci_vendor_id: 4318          # 0x10DE NVIDIA
  pci_device_id: 9008
