# VirtualGPU device profile: NVIDIA H100 NVL (Hopper, GH100, sm_90). One GPU of the NVL pair.
# Public values; verified: false -- nothing here has been measured on a card.
# Where each value comes from:
#   - compute capability 9.0 and every per-SM limit: read from physical H100s (nvidia/h100, nvidia/h100-pcie); the NVL is the same GH100.
#   - SMs 132: derived, not published. NVIDIA's H100 page gives 30 TFLOPS FP64 for the NVL (34 for the SXM5 at 132 SMs, 26 for the
#     PCIe at 114), which at the 1755 MHz boost clock the PCIe reads is 132 SMs of 64 FP64 lanes. The SXM5 H100 has 132.
#   - memory 94 GB HBM3, 3.9 TB/s, max TDP 350-400 W, PCIe Gen5, NVLink bridge: NVIDIA's H100 page (the page does not say whether
#     the figures are per GPU or per pair; the 94 GB and the 12 GB MIG slices are per GPU). NVIDIA's "GB" for graphics memory is binary (see rtx2080ti.yaml),
#     so vram_bytes is 96256 MiB (an upper bound, as for the H200).
#   - PCI device 0x2321, "NVIDIA H100 NVL", from the name table in NVIDIA's open GPU kernel modules (g_nv_name_released.h,
#     main at ca2d03e, 2026-10-07).
id: nvidia/h100-nvl
vendor: nvidia
model: "NVIDIA H100 NVL"
architecture: hopper
compute_capability: "9.0"
warp_size: 32
vram_bytes: 100931731456          # 96256 MiB; an upper bound, as for the B200
verified: false
limits:
  max_threads_per_block: 1024
  max_block_dim: [1024, 1024, 64]
  max_grid_dim: [2147483647, 65535, 65535]
  shared_mem_per_block_bytes: 49152
  shared_mem_per_block_optin_bytes: 232448
  registers_per_block: 65536
  multiprocessors: 132
  registers_per_sm: 65536
  max_threads_per_sm: 2048
  max_blocks_per_sm: 32
  max_registers_per_thread: 255
  shared_mem_per_sm: 233472
  l2_cache_bytes: 52428800
features:
  fp16: true
  bf16: true
  fp64: true
  tensor_cores: true

# Presentation-only values for monitoring tools (nvidia-smi / vgpu smi).
# NOT used by the execution engine -- VirtualGPU does not model performance.
telemetry:
  framebuffer_mb: 96256          # 94 GB in MiB; not measured on a card
  power_limit_w: 400             # Max TDP "350-400W (configurable)" (NVIDIA's H100 page): the top of the range
  sm_clock_max_mhz: 1755         # the H100 PCIe's 1755 MHz (read from a card); consistent with the page's 30 TFLOPS FP64 on 132 SMs (132 x 64 x 2 x 1.755 GHz = 29.7)
  mem_clock_max_mhz: 2539       # derived: 3.9 TB/s on 6144 bits is 5.08 Gbps, half of it; not a published clock
  pci_vendor_id: 4318            # 0x10DE NVIDIA
  pci_device_id: 8993            # 0x2321 [H100 NVL]
  ecc: true                     # supported and on by default (NVIDIA datasheet)
  memory: hbm                   # rows are remapped on failure
  pcie_link: "Gen5 x16"          # NVIDIA's H100 page: PCIe Gen5 128 GB/s

# What CUDA reports of the card beyond its limits (cudaDeviceProp, cuDeviceGetAttribute).
# Datasheet: six active HBM3 stacks (derived from 94 GB and 3.9 TB/s: six 16 GB stacks, 6144 bits), 50 MB L2. The persisting L2 maximum is three
# quarters of L2, as the A100's: not read from a card.
cuda:
  memory_bus_width_bits: 6144
  persisting_l2_bytes: 39321600

# How the SMs are grouped: the numbers NVIDIA publishes for this part, which a cluster launch needs
# (a cluster lives in one GPC). NVIDIA does not say how many TPCs each GPC has when some are
# disabled, so the spread across GPCs is always derived (even, larger first; vgpu::GpuLayout).
# Source: the H100 SXM5's figures (8 GPCs, 66 TPCs, 132 SMs); this profile's SM count is itself derived (see above), and NVIDIA gives no GPC count for the NVL.
layout:
  gpcs: 8
  tpcs: 66
  sms_per_tpc: 2
  counts_derived: true   # not this part's own published figures; see the source above

# Numerics: the sum this device's tensor core makes of f16, bf16 and tf32 products (wmma, mma.sync, HMMA). The engines read it
# from here. `provenance` gives each value one class (measured | documented | inferred | unknown) and `evidence` what the class
# rests on. Schema: nvidia/docs/profiles.md. The rule and every card run: docs/matrix-numerics.md.
numerics:
  tensor_sum: hopper               # sequential | ampere | hopper
  tensor_sum_chunk: 16             # products to a chunk, f16 and bf16
  tensor_sum_chunk_tf32: 8         # ... tf32
  tensor_sum_grid: 26              # a chunk's terms are cut at 2^(top - 26)
  tensor_sum_fp8: via_f16          # sequential | ada | via_f16: the e4m3 and e5m2 forms (mma.sync), summed as f16 ones are
  tensor_sum_wgmma_fp8: hopper     # sequential | hopper: the e4m3 and e5m2 forms of wgmma (dense)
  tensor_sum_wgmma_fp8_chunk: 32   # products to a chunk (all of K)
  tensor_sum_wgmma_fp8_grid: 14    # a chunk's terms are cut at 2^(top - 14)
  tensor_sum_wgmma_fp8_out_bits: 13  # fraction bits an f32 result keeps
  tensor_sum_wgmma: hopper          # sequential | hopper: wgmma with f16, bf16 and tf32 operands (dense)
provenance:
  inferred: [numerics.tensor_sum, numerics.tensor_sum_chunk, numerics.tensor_sum_chunk_tf32, numerics.tensor_sum_grid, numerics.tensor_sum_fp8, numerics.tensor_sum_wgmma_fp8, numerics.tensor_sum_wgmma_fp8_chunk, numerics.tensor_sum_wgmma_fp8_grid, numerics.tensor_sum_wgmma_fp8_out_bits, numerics.tensor_sum_wgmma]
evidence:
  numerics: "not run on this model. Inferred from the same compute capability (9.0) as the cards that were run on 2026-11-15: an H100 PCIe (nvidia/profiles/h100-pcie.yaml). docs/matrix-numerics.md"
  numerics.tensor_sum_fp8: "inferred, NOT run by us on a card. ptxas turns an FP8 mma.sync for sm_90 into a conversion to f16 and HMMA (the SASS shows F2FP.F16.E4M3.UNPACK_B), so the device's f16 rule sums the products. The 5,000 e4m3 and 5,000 e5m2 vectors with an f16 accumulator that Khattak and Mikaitis (arXiv 2512.07004) recorded on an H100 and on an H200 are reproduced by it; their f32-accumulator sets were recorded through wgmma with a zero accumulator and say nothing about mma.sync. docs/numerics/fp8-vectors.md, docs/matrix-numerics.md"
  numerics.tensor_sum_wgmma_fp8: "inferred, NOT run by us on a card. The 5,000 e4m3 and 5,000 e5m2 f32-accumulator vectors Khattak and Mikaitis recorded on an H100 and on an H200 through wgmma with a zero accumulator (arXiv 2512.07004; samples in nvidia/tests/data/tcpapers/fp8/) are reproduced bit for bit by one chunk of 32 products, each term cut 13 bits below the largest, the result cut to 13 fraction bits (tools/tcpapers/fit_fp8.py --zero-c); it is also MMA-Sim's Hopper wgmma FP8 rule (arXiv 2511.10909). Not seen with a non-zero accumulator or an f16 accumulator (the accumulator joins the chunk as it does on Ada), and not on a card of ours. Dense forms only: the sparse ones keep the sequential sum."
  numerics.tensor_sum_wgmma: "inferred, NOT run by us on a card, and no recorded vectors of wgmma with f16, bf16 or tf32 operands exist. Xie et al. (arXiv 2511.10909, MMA-Sim) give the wgmma f16, bf16 and tf32 forms of Hopper the numbers of its mma.sync (F = 25, chunks of 32 bytes of operands: 16 products, tf32 8), with the accumulator joining the chunk, and report them bit for bit against an H100; the mma.sync rule is measured on an H100 PCIe (numerics.tensor_sum, 8,388,608 of 8,388,608 wmma results). Dense forms only. docs/matrix-numerics.md"
