# VirtualGPU device profile: NVIDIA GB200 (one Blackwell GPU of the Grace
# Blackwell Superchip, sm_100).
# Public values; verified: false -- nothing here has been measured on a card.
# This differs from nvidia/b200 where NVIDIA publishes a per-GPU figure that does:
#   - memory: the GB200 NVL72 page gives the superchip (two Blackwell GPUs) "372 GB
#     HBM3E" and 16 TB/s, so one GPU has 186 GB and 8 TB/s (derived, halving the
#     superchip's figures). NVIDIA's "GB" for HBM is binary (a B200's 180 GB
#     reports 183359 MiB), so vram_bytes is 190464 MiB; an upper bound.
#   - PCI device 0x2941, "NVIDIA GB200", from the name table in NVIDIA's open GPU
#     kernel modules (g_nv_name_released.h); the B200 is 0x2901.
#   - NVLink: 3.6 TB/s for the superchip's two GPUs, 1.8 TB/s each, which is
#     NVLink 5's 18 links (the B200 profile's count).
# Everything else is COPIED from nvidia/b200 because NVIDIA's page gives no
# separate figure: compute capability 10.0 (CUDA GPUs table lists GB200 as 10.0),
# the SM count (148, itself unverified there), per-SM limits, clocks, and the
# 1000 W power limit (the page lists no TDP), the 90 C limit and the memory
# sensor. The Grace link is NVLink-C2C, so the PCIe link is left out rather than
# taken from the B200.
#   - CUDA attributes (the `cuda:` section): the bus width is the B200's; the L2 is the B200's: NVIDIA's Blackwell Tuning Guide gives the GB200 GPU 126 MB.
id: nvidia/gb200
vendor: nvidia
model: "NVIDIA GB200"
architecture: blackwell
compute_capability: "10.0"
warp_size: 32
vram_bytes: 199715979264         # 190464 MiB; an upper bound, as for the B200
verified: false
limits:
  max_threads_per_block: 1024
  max_block_dim: [1024, 1024, 64]
  max_grid_dim: [2147483647, 65535, 65535]
  shared_mem_per_block_bytes: 49152
  shared_mem_per_block_optin_bytes: 232448   # 227 KiB (sm_100)
  registers_per_block: 65536
  multiprocessors: 148           # nvidia/b200's; no GB200 figure is published
  registers_per_sm: 65536
  max_threads_per_sm: 2048
  max_blocks_per_sm: 32
  max_registers_per_thread: 255
  shared_mem_per_sm: 233472
  l2_cache_bytes: 132120576      # 126 MiB: NVIDIA's Blackwell Tuning Guide (CUDA 12.8) gives the GB200 GPU 126 MB of L2; the same count of MiB as Hopper's 50 for 52428800. Documented, not read from a card.
features:
  fp16: true
  bf16: true
  fp64: true
  tensor_cores: true

# Presentation-only values for monitoring tools (nvidia-smi / vgpu smi).
# NOT used by the execution engine -- VirtualGPU does not model performance.
telemetry:
  framebuffer_mb: 190464         # 186 GB in MiB; not measured on a card
  power_limit_w: 1000            # the B200's; unpublished per GPU
  sm_clock_max_mhz: 1965         # the B200's until measured
  mem_clock_max_mhz: 4000        # the B200's until measured
  temperature_max_c: 90
  pci_vendor_id: 4318            # 0x10DE NVIDIA
  pci_device_id: 10561           # 0x2941 [GB200]
  ecc: true
  memory: hbm
  memory_temperature: true
  nvlink: "NVLink5 x18"          # see the header

# What CUDA reports of the card beyond its limits (cudaDeviceProp, cuDeviceGetAttribute).
# Memory interface 8192 bits: COPIED from nvidia/b200 (eight HBM3e stacks); NVIDIA's GB200 page gives no width.
# The L2 is the tuning guide's 126 MB (limits above); the persisting L2 is inferred as the B200's.
cuda:
  memory_bus_width_bits: 8192
  persisting_l2_bytes: 99090432   # 3/4 of the L2, twelve sixteenths, as the A100 and the H100 (31457280, 39321600): INFERRED, no Blackwell data-centre card has said (an A10G and an L4 are eleven sixteenths)

# Numerics: the sum this device's tensor core makes of f16, bf16 and tf32 products (wmma, mma.sync, HMMA). The engines read it
# from here. `provenance` gives each value one class (measured | documented | inferred | unknown) and `evidence` what the class
# rests on. Schema: nvidia/docs/profiles.md. The rule and every card run: docs/matrix-numerics.md.
numerics:
  tensor_sum: hopper               # sequential | ampere | hopper
  tensor_sum_chunk: 16             # products to a chunk, f16 and bf16
  tensor_sum_chunk_tf32: 8         # ... tf32
  tensor_sum_grid: 26              # a chunk's terms are cut at 2^(top - 26)
  tensor_sum_fp8: via_f16          # sequential | ada | via_f16: the e4m3 and e5m2 forms (mma.sync), summed as f16 ones are
  tensor_sum_tcgen05: hopper        # sequential | hopper: tcgen05.mma .kind::f16 and .kind::tf32 (dense)
provenance:
  inferred: [numerics.tensor_sum, numerics.tensor_sum_chunk, numerics.tensor_sum_chunk_tf32, numerics.tensor_sum_grid, numerics.tensor_sum_fp8, numerics.tensor_sum_tcgen05]
evidence:
  numerics: "inferred from data recorded by others on a B200 (compute capability 10.0, the same as this GB200's), NOT run by us on a card, and not on a GB200. Khattak and Mikaitis (arXiv 2512.07004) recorded 20,000 test vectors on a B200 (f16 with an f32 accumulator, f16 with an f16 accumulator, bf16, tf32); this rule (chunks of 16, tf32 8, grid 26: the Hopper rule, also given to Blackwell by MMA-Sim, Xie et al., arXiv 2511.10909) reproduces all 20,000 and the sequential f32 sum mismatches 8,020. mma.sync, wmma and HMMA only; tcgen05.mma is not covered. VGPU_TC_EXACT=0 gives the earlier sequential sum back. docs/matrix-numerics.md, docs/numerics/tcpapers.md"
  numerics.tensor_sum_fp8: "inferred from data recorded by others on a B200, NOT run by us on a card. ptxas turns an FP8 mma.sync for sm_100 into a conversion to f16 and HMMA (F2FP.F16.E4M3.UNPACK_B in the SASS), so the device's f16 rule sums the products. The 5,000 e4m3 and 5,000 e5m2 vectors, f32 and f16 accumulators, that Khattak and Mikaitis (arXiv 2512.07004) recorded on a B200 are reproduced by it. docs/numerics/fp8-vectors.md, docs/matrix-numerics.md"
  numerics.tensor_sum_tcgen05: "inferred, NOT run by us on a card, and no recorded vectors of tcgen05.mma exist. Xie et al. (arXiv 2511.10909, MMA-Sim) give tcgen05.mma .kind::f16 and .kind::tf32 on Blackwell F = 25 and chunks of 32 bytes of operands (16 products, tf32 8), the accumulator joining the chunk: the numbers of the mma.sync rule that 20,000 vectors recorded by Khattak and Mikaitis on a B200 reproduce (numerics.tensor_sum). Khattak and Mikaitis's B200TCRN.m (final f32 rounding to nearest) is a variant for which no vectors exist; it is not used. Dense forms only. docs/matrix-numerics.md"
