# VirtualGPU device profile: NVIDIA GeForce RTX 4090 (Ada Lovelace, AD102, sm_89).
# Public values; verified: false -- nothing here has been measured on a card.
# Where each value comes from:
#   - compute capability 8.9: NVIDIA's CUDA GPUs table (developer.nvidia.com/cuda-gpus).
#   - SMs 128: NVIDIA Ada GPU Architecture whitepaper (v2.1), Table 1 and Appendix A
#     (RTX 4090: 128 SMs, 16384 CUDA Cores at 128 an SM, 512 Tensor Cores); the
#     GeForce RTX 4090 page gives the same 16384 cores.
#   - memory 24 GB GDDR6X, 21 Gbps, 384-bit, 1008 GB/s, boost clock 2520 MHz and
#     450 W Total Graphics Power: the whitepaper and the product page. NVIDIA's
#     "GB" for graphics memory is binary (see rtx2080ti.yaml), so vram_bytes is
#     24576 MiB; a real card's nvidia-smi total is a little smaller, so this is
#     an upper bound.
#   - PCIe Gen4: the whitepaper's Table 2 and the product page; x16 is the slot the
#     card is built for, not a figure NVIDIA states there.
#   - PCI device 0x2684, "NVIDIA GeForce RTX 4090", from the name table in NVIDIA's
#     open GPU kernel modules (g_nv_name_released.h).
#   - Per-SM limits are compute capability 8.9's, the same as nvidia/l4 and
#     nvidia/l40s, which were read from physical cards.
#   - CUDA attributes (the `cuda:` section and l2_cache_bytes): L2 73728 KB and the 384-bit bus: Ada whitepaper; persisting L2 is 3/4 of the L2, nvidia/l40s's measured ratio.
id: nvidia/rtx4090
vendor: nvidia
model: "NVIDIA GeForce RTX 4090"
architecture: ada
compute_capability: "8.9"
warp_size: 32
vram_bytes: 25769803776          # 24576 MiB; an upper bound, as for the B200
verified: false
limits:
  max_threads_per_block: 1024
  max_block_dim: [1024, 1024, 64]
  max_grid_dim: [2147483647, 65535, 65535]
  shared_mem_per_block_bytes: 49152
  shared_mem_per_block_optin_bytes: 101376
  registers_per_block: 65536
  multiprocessors: 128
  registers_per_sm: 65536
  max_threads_per_sm: 1536
  max_blocks_per_sm: 24
  max_registers_per_thread: 255
  shared_mem_per_sm: 102400
  l2_cache_bytes: 75497472
features:
  fp16: true
  bf16: true
  fp64: true
  tensor_cores: true

# Presentation-only values for monitoring tools (nvidia-smi / vgpu smi).
# NOT used by the execution engine -- VirtualGPU does not model performance.
telemetry:
  framebuffer_mb: 24576          # 24 GB in MiB; not measured on a card
  power_limit_w: 450             # Total Graphics Power (whitepaper, product page)
  sm_clock_max_mhz: 2520         # boost clock (whitepaper, product page)
  mem_clock_max_mhz: 10500       # half the published 21 Gbps data rate; nvidia-smi reports 1 MHz more on real cards
  pci_vendor_id: 4318            # 0x10DE NVIDIA
  pci_device_id: 9860            # 0x2684 [GeForce RTX 4090]
  ecc: false                     # GeForce: no ECC
  memory: gddr                   # GDDR6X
  pcie_link: "Gen4 x16"          # see the header

# What CUDA reports of the card beyond its limits (cudaDeviceProp, cuDeviceGetAttribute).
# L2 73728 KB and the 384-bit memory interface: NVIDIA Ada whitepaper, Tables 1 and 2.
# Persisting L2 is 3/4 of the L2 (56623104), the ratio nvidia/l40s measured (75497472 of 100663296);
# NVIDIA does not publish it, so this is derived, unverified.
cuda:
  memory_bus_width_bits: 384
  persisting_l2_bytes: 56623104
