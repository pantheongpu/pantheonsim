id: nvidia/rtx3060
vendor: nvidia
model: "NVIDIA GeForce RTX 3060"
architecture: ampere
compute_capability: "8.6"
warp_size: 32
vram_bytes: 12884377600
verified: true
limits:
  max_threads_per_block: 1024
  max_block_dim: [1024, 1024, 64]
  max_grid_dim: [2147483647, 65535, 65535]
  shared_mem_per_block_bytes: 49152
  shared_mem_per_block_optin_bytes: 101376
  registers_per_block: 65536
  multiprocessors: 28
  registers_per_sm: 65536
  max_threads_per_sm: 1536
  max_blocks_per_sm: 16
  max_registers_per_thread: 255
  shared_mem_per_sm: 102400
features:
  fp16: true
  bf16: true
  fp64: true
  tensor_cores: true
telemetry:
  framebuffer_mb: 12288          # nvidia-smi total on real cards (199 runs in the benchmark database)
  power_limit_w: 190
  sm_clock_max_mhz: 2145
  mem_clock_max_mhz: 7501
  temperature_max_c: 95
  pci_vendor_id: 4318          # 0x10DE
  pci_device_id: 9476          # 0x2504
  ecc: false                   # GeForce: no ECC
  memory: gddr                 # no ECC, so nothing is retired
  pcie_link: "Gen4 x16"        # most common link on real cards (275 of 335 runs in the benchmark database)

# Facts only NVML reports. Sources are per line; none reaches the execution engine.
nvml:
  memory_bus_width_bits: 192      # 192-bit GDDR6, read from the card: nvmlDeviceGetMemoryBusWidth through NVIDIA's NVML 13.0 (WSL driver 596.36) answers 192; brand 5 (NVML_BRAND_GEFORCE); 2 fans (nvmlDeviceGetNumFans); no NVLink (every NVLink query is NOT_SUPPORTED)
  brand: geforce
  fans: 2                     # measured on the card (nvmlDeviceGetNumFans)
  mig: false                    # no Multi-Instance GPU (datasheet)
  nvenc: true                 # has NVENC engines (datasheet)
  nvdec: true                 # has NVDEC engines (datasheet)
  # Clock tables, read from the card (nvmlDeviceGetSupportedMemoryClocks, GetSupportedGraphicsClocks,
  # GetSupportedPerformanceStates and GetMinMaxClockOfPState through NVIDIA's NVML 13.0, WSL driver 596.36):
  # five memory clocks; 227 graphics clocks per memory clock from the top in 7.5 MHz steps to 405 MHz; only 420, 412
  # and 405 MHz at the lowest memory clock; P-states 8, 5, 3, 2 and 0, the lowest reaching down to 210 MHz.
  # The top of the list is the profile's sm_clock_max_mhz (the card read measured 2100 MHz, this profile's silicon 2145).
  memory_clocks_mhz: [7501, 7301, 5001, 810, 405]
  pstates: [8, 5, 3, 2, 0]
  graphics_step_tenths_mhz: 75
  graphics_list_floor_mhz: 405
  graphics_floor_mhz: 210
  idle_graphics_max_mhz: 420
  # Also read from the card through NVML 13.0 (WSL driver 596.36): the overclocking offset ranges
  # (nvmlDeviceGetClockOffsets: graphics -1000..1000 MHz, memory -2000..6000 MHz), the fan range
  # (nvmlDeviceGetMinMaxFanSpeed: 30..100 percent), the video clock's range in performance states
  # (nvmlDeviceGetMinMaxClockOfPState: 555..1950 MHz) and the inforom versions (OEM object 2.0, image G001.0000.03.03).
  gpc_offset_min_mhz: -1000
  gpc_offset_max_mhz: 1000
  mem_offset_min_mhz: -2000
  mem_offset_max_mhz: 6000
  fan_min_percent: 30
  fan_max_percent: 100
  video_clock_floor_mhz: 555
  video_clock_max_mhz: 1950
  inforom_oem: "2.0"
  inforom_image: "G001.0000.03.03"
