# VirtualGPU device profile: NVIDIA L4
# Generated by nvidia/tools/characterize.cu from a physical device.
# Every value below was read from the hardware, not a datasheet.
id: nvidia/l4
vendor: nvidia
model: "NVIDIA L4"
architecture: ada
compute_capability: "8.9"
warp_size: 32
vram_bytes: 23661248512
verified: true
limits:
  max_threads_per_block: 1024
  max_block_dim: [1024, 1024, 64]
  max_grid_dim: [2147483647, 65535, 65535]
  shared_mem_per_block_bytes: 49152
  shared_mem_per_block_optin_bytes: 101376
  registers_per_block: 65536
  multiprocessors: 58
  registers_per_sm: 65536
  max_threads_per_sm: 1536
  max_blocks_per_sm: 24
  max_registers_per_thread: 255
  shared_mem_per_sm: 102400
  l2_cache_bytes: 50331648          # AD104 datasheet
features:
  fp16: true
  bf16: true
  fp64: true
  tensor_cores: true
telemetry:
  framebuffer_mb: 23034          # nvidia-smi total on real cards (594 runs in the benchmark database)
  power_limit_w: 72
  sm_clock_max_mhz: 2040
  mem_clock_max_mhz: 6251
  # temperature_max_c: this driver did not report a thermal threshold
  pci_vendor_id: 4318          # 0x10DE
  pci_device_id: 10168          # 0x27B8
  ecc: true                    # supported and on by default (NVIDIA datasheet)
  memory: gddr                 # GDDR; Ampere and later remap rows rather than retire pages (see telemetry.cpp)
  pcie_link: "Gen4 x8"         # most common link on real cards (594 runs in the benchmark database)

# What CUDA reports of the card beyond its limits (cudaDeviceProp, cuDeviceGetAttribute).
# Datasheet: AD104 memory interface and 48 MB L2. The persisting L2 maximum was read from an L4 (driver 595.91, AWS g6.xlarge,
# 2026-10-09): 34603008 bytes (33 MiB; the A100's three quarters of L2 would have been 36 MiB).
cuda:
  memory_bus_width_bits: 192
  persisting_l2_bytes: 34603008

# How the SMs are grouped: the numbers NVIDIA publishes for this part, which a cluster launch needs
# (a cluster lives in one GPC). NVIDIA does not say how many TPCs each GPC has when some are
# disabled, so the spread across GPCs is always derived (even, larger first; vgpu::GpuLayout).
# Source: NVIDIA Ada GPU Architecture whitepaper, Table 5 (NVIDIA L4): GPCs 5, TPCs 29, SMs 58.
layout:
  gpcs: 5
  tpcs: 29
  sms_per_tpc: 2

# Numerics: the sum this device's tensor core makes of f16, bf16 and tf32 products (wmma, mma.sync, HMMA). The engines read it
# from here. `provenance` gives each value one class (measured | documented | inferred | unknown) and `evidence` what the class
# rests on. Schema: nvidia/docs/profiles.md. The rule and every card run: docs/matrix-numerics.md.
numerics:
  tensor_sum: ampere               # sequential | ampere | hopper
  tensor_sum_chunk: 8              # products to a chunk, f16 and bf16
  tensor_sum_chunk_tf32: 4         # ... tf32
  tensor_sum_grid: 25              # a chunk's terms are cut at 2^(top - 25)
  tensor_sum_fp8: ada              # sequential | ada | via_f16: the e4m3 and e5m2 forms (mma.sync)
  tensor_sum_fp8_chunk: 16         # products to a chunk
  tensor_sum_fp8_grid: 14          # a chunk's terms are cut at 2^(top - 14)
  tensor_sum_fp8_out_bits: 13      # fraction bits an f32 result keeps
  tensor_sum_m8n8k4: chain_c_last   # sequential | volta | chain_c_last: mma.m8n8k4 (f32 accumulator; PTX engine)
  tensor_sum_sparse: ampere         # sequential | ampere: mma.sp / HMMA.SP with f16, bf16, tf32 operands
provenance:
  inferred: [numerics.tensor_sum_fp8, numerics.tensor_sum_fp8_chunk, numerics.tensor_sum_fp8_grid, numerics.tensor_sum_fp8_out_bits, numerics.tensor_sum_m8n8k4, numerics.tensor_sum_sparse]
  measured: [numerics.tensor_sum, numerics.tensor_sum_chunk, numerics.tensor_sum_chunk_tf32, numerics.tensor_sum_grid]
evidence:
  numerics: "card: NVIDIA L4 (this model), AWS; driver: 595.112.07; toolkit: CUDA 13.0; date: 2026-11-15. Both probes, sm_86 and sm_89 builds, print the RTX 3060 lines (nvidia/tests/data/simd_lane_forms.rtx3060.txt, float_half_forms.rtx3060.txt); FTTN. docs/matrix-numerics.md"
  numerics.tensor_sum_fp8: "inferred from data recorded by others, NOT run by us on a card. Khattak and Mikaitis (arXiv 2512.07004) recorded 5,000 e4m3 and 5,000 e5m2 mma.sync m16n8k32 vectors with an f32 accumulator on an L40S and on an RTX 1000 Ada, and the same with an f16 accumulator on the RTX 1000 Ada; MMA-Sim (arXiv 2511.10909) gives the same numbers (chunks of 16, terms cut 13 bits below the largest, an f32 result cut to 13 fraction bits). The rule reproduces them (docs/numerics/fp8-vectors.md). Before this the sum was sequential in f32, which reproduces none of the f32 vectors. docs/matrix-numerics.md"
  numerics.tensor_sum_fp8_chunk: "see numerics.tensor_sum_fp8"
  numerics.tensor_sum_fp8_grid: "see numerics.tensor_sum_fp8"
  numerics.tensor_sum_fp8_out_bits: "see numerics.tensor_sum_fp8"
  numerics.tensor_sum_m8n8k4: "inferred from the A10G (sm_86, measured 2026-11-23, see numerics.tensor_sum_m8n8k4 of nvidia/profiles/a10g.yaml): ptxas emulates mma.m8n8k4 as f32 products added in order with C last on sm_80 and later; no card of this model was run, and the emulation is the cubin's (nvcc 13.0.88), not the hardware's. An f32 accumulator only. docs/numerics/m8n8k4-and-sparse.md"
  numerics.tensor_sum_sparse: "inferred from the A10G (sm_86, measured 2026-11-23, see numerics.tensor_sum_sparse of nvidia/profiles/a10g.yaml): the Ampere rule over the stored products; no card of this model was run. docs/numerics/m8n8k4-and-sparse.md"
