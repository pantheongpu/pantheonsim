# VirtualGPU device profile: NVIDIA RTX PRO 6000 Blackwell Workstation Edition
# (GB202, sm_120).
# Public values; verified: false -- nothing here has been measured on a card.
# Where each value comes from:
#   - compute capability 12.0: NVIDIA's CUDA GPUs table (developer.nvidia.com/cuda-gpus).
#   - SMs 188: NVIDIA RTX Blackwell GPU Architecture whitepaper (v1.0), Table 1
#     (RTX PRO 6000 Blackwell Workstation Edition: 188 SMs, 24064 CUDA Cores at
#     128 an SM, 752 Tensor Cores); the full GB202 has 192. The Max-Q data sheet
#     gives the same 24,064 cores.
#   - memory 96 GB GDDR7 with ECC, 512-bit, 28 Gbps, 1792 GB/s, boost clock 2617 MHz,
#     600 W Total Graphics Power, PCIe Gen 5: the same table and NVIDIA's product
#     page. NVIDIA's "GB" for graphics memory is binary (see rtx2080ti.yaml), so
#     vram_bytes is 98304 MiB; a real card's nvidia-smi total is a little smaller,
#     so this is an upper bound.
#   - PCI device 0x2BB1, "NVIDIA RTX PRO 6000 Blackwell Workstation Edition", from
#     the name table in NVIDIA's open GPU kernel modules (g_nv_name_released.h).
#   - Per-SM limits are compute capability 12.0's, the same as nvidia/rtx5090: the
#     CUDA C++ Programming Guide's table (64K registers, 1536 threads, 24 blocks,
#     100 KB shared memory an SM, 99 KB a block), and the whitepaper's 256 KB
#     register file an SM.
#   - CUDA attributes (the `cuda:` section and l2_cache_bytes): L2 131072 KB and the 512-bit bus: RTX Blackwell whitepaper; persisting L2 is 3/4 of the L2, nvidia/rtx5090's ratio.
id: nvidia/rtx-pro-6000
vendor: nvidia
model: "NVIDIA RTX PRO 6000 Blackwell Workstation Edition"
architecture: blackwell
compute_capability: "12.0"
warp_size: 32
vram_bytes: 103079215104         # 98304 MiB; an upper bound, as for the B200
verified: false
limits:
  max_threads_per_block: 1024
  max_block_dim: [1024, 1024, 64]
  max_grid_dim: [2147483647, 65535, 65535]
  shared_mem_per_block_bytes: 49152
  shared_mem_per_block_optin_bytes: 101376   # 99 KiB (compute capability 12.0)
  registers_per_block: 65536
  multiprocessors: 188
  registers_per_sm: 65536
  max_threads_per_sm: 1536
  max_blocks_per_sm: 24
  max_registers_per_thread: 255
  shared_mem_per_sm: 102400
  l2_cache_bytes: 134217728
features:
  fp16: true
  bf16: true
  fp64: true
  tensor_cores: true

# Presentation-only values for monitoring tools (nvidia-smi / vgpu smi).
# NOT used by the execution engine -- VirtualGPU does not model performance.
telemetry:
  framebuffer_mb: 98304          # 96 GB in MiB; not measured on a card
  power_limit_w: 600             # Total Graphics Power (whitepaper, product page)
  sm_clock_max_mhz: 2617         # boost clock (whitepaper)
  mem_clock_max_mhz: 14000       # half the published 28 Gbps data rate; nvidia-smi reports 1 MHz more on real cards
  pci_vendor_id: 4318            # 0x10DE NVIDIA
  pci_device_id: 11185           # 0x2BB1 [RTX PRO 6000 Blackwell Workstation Edition]
  ecc: true                      # "96 GB GDDR7 with ECC" (data sheet)
  memory: gddr
  pcie_link: "Gen5 x16"          # Max-Q data sheet: PCIe 5.0 x16; the whitepaper: Gen 5

# What CUDA reports of the card beyond its limits (cudaDeviceProp, cuDeviceGetAttribute).
# L2 131072 KB and the 512-bit memory interface: NVIDIA RTX Blackwell whitepaper, Table 1.
# Persisting L2 is 3/4 of the L2 (100663296), the ratio nvidia/rtx5090 carries (75497472 of
# 100663296); NVIDIA does not publish it, so this is derived, unverified.
cuda:
  memory_bus_width_bits: 512
  persisting_l2_bytes: 100663296
