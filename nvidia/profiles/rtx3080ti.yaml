# VirtualGPU device profile: NVIDIA GeForce RTX 3080 Ti
# Generated by nvidia/tools/characterize.cu from a physical device.
# Every value below was read from the hardware, not a datasheet: an RTX 3080 Ti
# (GA102) on server1, driver 595.84, the card whose registers are mapped in
# nvidia/registers/measurements/rtx3080ti.
id: nvidia/rtx3080ti
vendor: nvidia
model: "NVIDIA GeForce RTX 3080 Ti"
architecture: ampere
compute_capability: "8.6"
warp_size: 32
vram_bytes: 12490768384
verified: true
limits:
  max_threads_per_block: 1024
  max_block_dim: [1024, 1024, 64]
  max_grid_dim: [2147483647, 65535, 65535]
  shared_mem_per_block_bytes: 49152
  shared_mem_per_block_optin_bytes: 101376
  registers_per_block: 65536
  multiprocessors: 80
  registers_per_sm: 65536
  max_threads_per_sm: 1536
  max_blocks_per_sm: 16
  max_registers_per_thread: 255
  shared_mem_per_sm: 102400
  l2_cache_bytes: 6291456          # GA102 datasheet
features:
  fp16: true
  bf16: true
  fp64: true
  tensor_cores: true
telemetry:
  framebuffer_mb: 12288          # nvidia-smi total on this card
  power_limit_w: 400
  sm_clock_max_mhz: 2100
  mem_clock_max_mhz: 9501
  temperature_max_c: 95
  pci_vendor_id: 4318          # 0x10DE
  pci_device_id: 8712          # 0x2208
  ecc: false                   # GeForce: no ECC
  memory: gddr                 # GDDR6X; no ECC, so nothing is retired
  pcie_link: "Gen4 x16"        # this card's link (nvidia/registers/measurements/rtx3080ti)

# What CUDA reports of the card beyond its limits (cudaDeviceProp, cuDeviceGetAttribute).
# Datasheet: GA102 memory interface, 6 MB L2, 1665 MHz boost clock. The persisting L2 maximum is the 3060's ratio (11/16 of L2), the same Ampere part family.
cuda:
  memory_bus_width_bits: 384
  clock_khz: 1665000
  persisting_l2_bytes: 4325376

# How the SMs are grouped: the numbers NVIDIA publishes for this part, which a cluster launch needs
# (a cluster lives in one GPC). NVIDIA does not say how many TPCs each GPC has when some are
# disabled, so the spread across GPCs is always derived (even, larger first; vgpu::GpuLayout).
# Source: NVIDIA Ada GPU Architecture whitepaper, Table 3 (GeForce RTX 3080 Ti): GPCs 7, TPCs 40, SMs 80.
layout:
  gpcs: 7
  tpcs: 40
  sms_per_tpc: 2
