# VirtualGPU device profile: NVIDIA RTX PRO 4500 Blackwell Server Edition
# Generated by nvidia/tools/characterize.cu from a physical device.
# Every value below was read from the hardware, not a datasheet. Card: an AWS g7.2xlarge
# (driver 595.91.07, CUDA 13.2, 2026-10-18). Not recorded here because the run did not read
# them: ECC, memory type, PCIe link and how the SMs group into GPCs (no `layout:`, so
# a cluster launch spreads SMs evenly). The L2 size is the datasheet's.
id: nvidia/rtx-pro-4500
vendor: nvidia
model: "NVIDIA RTX PRO 4500 Blackwell Server Edition"
architecture: blackwell
compute_capability: "12.0"
warp_size: 32
vram_bytes: 33689829376
verified: true
limits:
  max_threads_per_block: 1024
  max_block_dim: [1024, 1024, 64]
  max_grid_dim: [2147483647, 65535, 65535]
  shared_mem_per_block_bytes: 49152
  shared_mem_per_block_optin_bytes: 101376
  registers_per_block: 65536
  multiprocessors: 82
  registers_per_sm: 65536
  max_threads_per_sm: 1536
  max_blocks_per_sm: 24
  max_registers_per_thread: 255
  shared_mem_per_sm: 102400
  l2_cache_bytes: 67108864          # GB203 datasheet (64 MB); the card's persisting maximum, 40 MiB, is five eighths of it
features:
  fp16: true
  bf16: true
  fp64: true
  tensor_cores: true
cuda:
  memory_bus_width_bits: 256
  clock_khz: 2415000
  async_engine_count: 2
  persisting_l2_bytes: 41943040
telemetry:
  framebuffer_mb: 32623          # nvidia-smi total on the card
  power_limit_w: 165
  sm_clock_max_mhz: 2415
  mem_clock_max_mhz: 12501
  # temperature_max_c: this driver did not report a thermal threshold
  pci_vendor_id: 4318          # 0x10DE
  pci_device_id: 11322          # 0x2C3A

# Numerics: the sum this device's tensor core makes of f16, bf16 and tf32 products (wmma, mma.sync, HMMA). The engines read it
# from here. `provenance` gives each value one class (measured | documented | inferred | unknown) and `evidence` what the class
# rests on. Schema: nvidia/docs/profiles.md. The rule and every card run: docs/matrix-numerics.md.
numerics:
  tensor_sum: sequential           # sequential | ampere | hopper
  tensor_sum_published: hopper     # a published model exists; NOT in force by default: VGPU_TC_EXACT=published turns it on
provenance:
  unknown: [numerics.tensor_sum]
  inferred: [numerics.tensor_sum_published]
evidence:
  numerics.tensor_sum: "no card of compute capability 12.0 has been run by us. The sequential f32 sum is what the simulator does until one is, not a claim about the card. docs/matrix-numerics.md"
  numerics.tensor_sum_published: "published, not measured by us: MMA-Sim (Xie et al., arXiv 2511.10909) and Khattak and Mikaitis (arXiv 2512.07004) give B200 and RTX PRO 6000 Blackwell the hopper numbers (chunks of 16, tf32 8, grid 26) for f16, bf16 and tf32; applied to compute capability 10.0 and 12.0. Opt-in only. docs/matrix-numerics.md"
