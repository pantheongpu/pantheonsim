# VirtualGPU device profile: NVIDIA L40S
# Generated by nvidia/tools/characterize.cu from a physical device.
# Every value below was read from the hardware, not a datasheet.
id: nvidia/l40s
vendor: nvidia
model: "NVIDIA L40S"
architecture: ada
compute_capability: "8.9"
warp_size: 32
vram_bytes: 47667740672
verified: true
limits:
  max_threads_per_block: 1024
  max_block_dim: [1024, 1024, 64]
  max_grid_dim: [2147483647, 65535, 65535]
  shared_mem_per_block_bytes: 49152
  shared_mem_per_block_optin_bytes: 101376
  registers_per_block: 65536
  multiprocessors: 142
  registers_per_sm: 65536
  max_threads_per_sm: 1536
  max_blocks_per_sm: 24
  max_registers_per_thread: 255
  shared_mem_per_sm: 102400
  l2_cache_bytes: 100663296          # AD102 datasheet
features:
  fp16: true
  bf16: true
  fp64: true
  tensor_cores: true
telemetry:
  framebuffer_mb: 46068          # nvidia-smi total on real cards (510 runs in the benchmark database)
  power_limit_w: 350
  sm_clock_max_mhz: 2520
  mem_clock_max_mhz: 9001
  # temperature_max_c: this driver did not report a thermal threshold
  pci_vendor_id: 4318          # 0x10DE
  pci_device_id: 9913          # 0x26B9
  ecc: true                    # supported and on by default (NVIDIA datasheet)
  memory: gddr                 # GDDR; Ampere and later remap rows rather than retire pages (see telemetry.cpp)
  pcie_link: "Gen4 x8"         # most common link on real cards (510 runs in the benchmark database)

# What CUDA reports of the card beyond its limits (cudaDeviceProp, cuDeviceGetAttribute).
# Datasheet: AD102 memory interface and 96 MB L2. The persisting L2 maximum (69206016, eleven sixteenths of L2, the L4's ratio) was read
# from an AWS g6e.2xlarge on 2026-10-09 (driver 595.91.07); the three quarters this profile carried before was a guess.
cuda:
  memory_bus_width_bits: 384
  persisting_l2_bytes: 69206016

# How the SMs are grouped: the numbers NVIDIA publishes for this part, which a cluster launch needs
# (a cluster lives in one GPC). NVIDIA does not say how many TPCs each GPC has when some are
# disabled, so the spread across GPCs is always derived (even, larger first; vgpu::GpuLayout).
# Source: the L40's figures (GPCs 12, TPCs 71, SMs 142, NVIDIA Ada whitepaper Table 4); the L40S has the same SM count and NVIDIA gives no separate GPC count for it.
layout:
  gpcs: 12
  tpcs: 71
  sms_per_tpc: 2
  counts_derived: true   # not this part's own published figures; see the source above
