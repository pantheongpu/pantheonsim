# VirtualGPU device profile: NVIDIA GeForce RTX 3070 (Ampere, GA104, sm_86).
# Public values; verified: false -- nothing here has been measured on a card.
# Where each value comes from:
#   - compute capability 8.6: NVIDIA's CUDA GPUs table (developer.nvidia.com/cuda-gpus).
#   - SMs 46: NVIDIA Ampere GA102 GPU Architecture whitepaper (v2), Appendix A, Table 10 (RTX 3070 FE: 46 SMs, 5888 CUDA Cores at 128 an SM, 184 Tensor Cores).
#   - memory 8 GB GDDR6, 14 Gbps, 256-bit, 448 GB/s, boost clock 1725 MHz and 220 W Total Graphics Power: the same table. NVIDIA's "GB" for graphics memory is binary (see rtx2080ti.yaml),
#     so vram_bytes is 8192 MiB; a real card's nvidia-smi total is a little smaller, so this is an upper bound.
#   - PCI device 0x2484, "NVIDIA GeForce RTX 3070", from the name table in NVIDIA's open GPU kernel modules (g_nv_name_released.h,
#     main at ca2d03e, 2026-10-07).
#   - Per-SM limits are compute capability 8.6's, the same as nvidia/a10 and nvidia/rtx3060, which were read from physical cards.
id: nvidia/rtx3070
vendor: nvidia
model: "NVIDIA GeForce RTX 3070"
architecture: ampere
compute_capability: "8.6"
warp_size: 32
vram_bytes: 8589934592          # 8192 MiB; an upper bound, as for the B200
verified: false
limits:
  max_threads_per_block: 1024
  max_block_dim: [1024, 1024, 64]
  max_grid_dim: [2147483647, 65535, 65535]
  shared_mem_per_block_bytes: 49152
  shared_mem_per_block_optin_bytes: 101376
  registers_per_block: 65536
  multiprocessors: 46
  registers_per_sm: 65536
  max_threads_per_sm: 1536
  max_blocks_per_sm: 16
  max_registers_per_thread: 255
  shared_mem_per_sm: 102400
  l2_cache_bytes: 4194304
features:
  fp16: true
  bf16: true
  fp64: true
  tensor_cores: true

# Presentation-only values for monitoring tools (nvidia-smi / vgpu smi).
# NOT used by the execution engine -- VirtualGPU does not model performance.
telemetry:
  framebuffer_mb: 8192          # 8 GB in MiB; not measured on a card
  power_limit_w: 220             # Total Graphics Power (GA102 whitepaper, Table 10)
  sm_clock_max_mhz: 1725         # boost clock, Founders Edition (GA102 whitepaper, Table 10)
  mem_clock_max_mhz: 7000       # half the published 14 Gbps data rate; nvidia-smi reports 1 MHz more on real cards
  pci_vendor_id: 4318            # 0x10DE NVIDIA
  pci_device_id: 9348            # 0x2484 [GeForce RTX 3070]
  ecc: false                     # GeForce: no ECC
  memory: gddr                   # GDDR; Ampere and later remap rows rather than retire pages (see telemetry.cpp)
  pcie_link: "Gen4 x16"          # the GA102 whitepaper's "PCIe Gen 4" section; x16 is the slot the card is built for

# What CUDA reports of the card beyond its limits (cudaDeviceProp, cuDeviceGetAttribute).
# L2 4096 KB and the 256-bit memory interface: NVIDIA Ampere GA102 whitepaper, Table 10. Persisting L2 is 11/16 of the L2 (2883584), the
# ratio nvidia/a10 and nvidia/rtx3060 both read from cards; NVIDIA does not publish it, so this is derived, unverified.
cuda:
  memory_bus_width_bits: 256
  persisting_l2_bytes: 2883584
