# VirtualGPU device profile: NVIDIA B200 (Blackwell).
# Public documentation values (sm_100). Blackwell public data is thinner than
# Hopper's; several values here are best-effort placeholders and MUST be
# revisited by hardware characterization. verified: false.
id: nvidia/b200
vendor: nvidia
model: "NVIDIA B200"
architecture: blackwell
compute_capability: "10.0"
warp_size: 32
vram_bytes: 192265846784         # capped at the measured framebuffer -- see below
# The spec sheet's "192 GB" is decimal (183105 MiB) and was stored here as
# 192 GiB (196608 MiB) -- 13 GB more than a real B200 has in total, which
# nvidia-smi on one showed as 183359 MiB (driver 580.105.08). totalGlobalMem
# is smaller than the framebuffer by the driver's reserve and has not been
# measured yet, so this is an upper bound rather than a characterization.
verified: false
limits:
  max_threads_per_block: 1024
  max_block_dim: [1024, 1024, 64]
  max_grid_dim: [2147483647, 65535, 65535]
  shared_mem_per_block_bytes: 49152
  shared_mem_per_block_optin_bytes: 232448   # 227 KiB (sm_100)
  registers_per_block: 65536
  multiprocessors: 148
  registers_per_sm: 65536
  max_threads_per_sm: 2048
  max_blocks_per_sm: 32
  max_registers_per_thread: 255
  shared_mem_per_sm: 233472
features:
  fp16: true
  bf16: true
  fp64: true
  tensor_cores: true

# Presentation-only values for monitoring tools (nvidia-smi / vgpu smi).
# NOT used by the execution engine -- VirtualGPU does not model performance.
# Public spec-sheet figures; PCI ids from the public NVIDIA device list.
telemetry:
  framebuffer_mb: 183359          # nvidia-smi total on real cards (1 run in the benchmark database)
  power_limit_w: 1000
  sm_clock_max_mhz: 1965
  mem_clock_max_mhz: 4000
  temperature_max_c: 90
  pci_vendor_id: 4318          # 0x10DE NVIDIA
  pci_device_id: 10497        # 0x2901 [B200] -- not in the local pci.ids; public listing
