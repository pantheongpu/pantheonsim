# VirtualGPU device profile: NVIDIA A10.
# Values are taken from public NVIDIA documentation (datasheet + CUDA
# programming guide, sm_86). verified: false means no value in this file has
# been confirmed by hardware characterization yet — treat as placeholders.
id: nvidia/a10
vendor: nvidia
model: "NVIDIA A10"
architecture: ampere
compute_capability: "8.6"
warp_size: 32
vram_bytes: 25769803776          # 24 GiB GDDR6
verified: false
limits:
  max_threads_per_block: 1024
  max_block_dim: [1024, 1024, 64]
  max_grid_dim: [2147483647, 65535, 65535]
  shared_mem_per_block_bytes: 49152
  shared_mem_per_block_optin_bytes: 101376   # 99 KiB (sm_86)
  registers_per_block: 65536
  multiprocessors: 72
  registers_per_sm: 65536
  max_threads_per_sm: 1536
  max_blocks_per_sm: 16
  max_registers_per_thread: 255
  shared_mem_per_sm: 102400
features:
  fp16: true
  bf16: true
  fp64: true
  tensor_cores: true

# Presentation-only values for monitoring tools (nvidia-smi / vgpu smi).
# NOT used by the execution engine -- VirtualGPU does not model performance.
# Public spec-sheet figures; PCI ids from the public NVIDIA device list.
telemetry:
  power_limit_w: 150
  sm_clock_max_mhz: 1695
  mem_clock_max_mhz: 6251
  temperature_max_c: 85
  pci_vendor_id: 4318          # 0x10DE NVIDIA
  pci_device_id: 8758        # 0x2236 GA102GL [A10]
